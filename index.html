<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>3D Creature AR</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080808;
    font-family: Arial, sans-serif;
}

#app {
    width: 100%;
    height: 100%;
    position: relative;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#menu {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 20;

    display: flex;
    flex-direction: column;
    gap: 8px;
}

button {
    border: 1px solid #444;
    background: #111;
    color: white;

    padding: 10px 16px;

    font-size: 13px;

    cursor: pointer;
}

button:hover {
    background: #222;
}

#sensorButton {
    display: none;
}

#status {
    position: absolute;
    left: 20px;
    bottom: 20px;

    z-index: 20;

    color: #aaa;
    background: rgba(0,0,0,.7);

    padding: 10px;

    font-size: 12px;

    max-width: 360px;
}

#phoneData {
    position: absolute;
    right: 20px;
    bottom: 20px;

    z-index: 20;

    color: #aaa;
    background: rgba(0,0,0,.7);

    padding: 10px;

    font-family: monospace;
    font-size: 11px;

    line-height: 1.5;
}
</style>
</head>

<body>

<div id="app">

    <div id="menu">
        <button id="arButton">AR</button>
        <button id="resetButton">Центр</button>
        <button id="sensorButton">Включить датчики телефона</button>
    </div>

    <div id="status">
        Загрузка 3D модели...
    </div>

    <div id="phoneData">
        alpha: --<br>
        beta: --<br>
        gamma: --<br>
        camera: --
    </div>

</div>

<script type="module">

import * as THREE from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { GLTFLoader } from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";

import { DRACOLoader } from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/DRACOLoader.js";

import { MeshoptDecoder } from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/libs/meshopt_decoder.module.js";


/* =========================================================
   ОСНОВНЫЕ ОБЪЕКТЫ
========================================================= */

const app =
    document.getElementById("app");

const status =
    document.getElementById("status");

const phoneData =
    document.getElementById("phoneData");

const arButton =
    document.getElementById("arButton");

const resetButton =
    document.getElementById("resetButton");

const sensorButton =
    document.getElementById("sensorButton");


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x080808);


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.01,
        1000
    );


/*
    Камера смотрит на центр сцены.
*/

const target =
    new THREE.Vector3(0, 0, 0);


/*
    Начальная позиция камеры.
*/

camera.position.set(
    0,
    1.5,
    4
);

camera.lookAt(target);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
    });

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.xr.enabled = true;

app.appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHT
========================================================= */

const ambient =
    new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        2
    );

scene.add(ambient);


const light =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

light.position.set(
    5,
    10,
    5
);

scene.add(light);


/* =========================================================
   WORLD
========================================================= */

const world =
    new THREE.Group();

scene.add(world);


/* =========================================================
   3D MODEL
========================================================= */

let model = null;


/*
    Если index.html находится в том же
    GitHub репозитории, что и creature.glb:

        ./creature.glb

    Если модель лежит в другой папке:

        ./models/creature.glb
*/

const MODEL_URL =
    "https://raw.githubusercontent.com/Roman22022000/phome_apple/main/creature.glb";


const loader =
    new GLTFLoader();


/*
    Draco
*/

const dracoLoader =
    new DRACOLoader();

dracoLoader.setDecoderPath(
    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/libs/draco/"
);

loader.setDRACOLoader(
    dracoLoader
);


/*
    Meshopt
*/

loader.setMeshoptDecoder(
    MeshoptDecoder
);


/* =========================================================
   ЗАГРУЗКА
========================================================= */

loader.load(

    MODEL_URL,

    function(gltf) {

        model =
            gltf.scene;

        /*
            Получаем bounding box.
        */

        const box =
            new THREE.Box3()
                .setFromObject(model);

        const center =
            new THREE.Vector3();

        box.getCenter(center);

        /*
            Переносим модель
            точно в 0,0,0.
        */

        model.position.sub(center);


        /*
            Масштабирование.
        */

        const size =
            new THREE.Vector3();

        box.getSize(size);

        const maxSize =
            Math.max(
                size.x,
                size.y,
                size.z
            );

        if (maxSize > 0) {

            const scale =
                2 / maxSize;

            model.scale.setScalar(
                scale
            );
        }


        world.add(model);


        status.textContent =
            "3D модель загружена";


        console.log(
            "MODEL LOADED",
            model
        );

    },

    function(xhr) {

        if (xhr.total) {

            const percent =
                (xhr.loaded / xhr.total) * 100;

            status.textContent =
                "Загрузка: " +
                percent.toFixed(0) +
                "%";
        }

    },

    function(error) {

        console.error(
            "MODEL ERROR:",
            error
        );

        status.textContent =
            "Ошибка загрузки 3D модели";
    }

);


/* =========================================================
   ОРБИТАЛЬНАЯ КАМЕРА
========================================================= */

/*
    Эти параметры отвечают за вращение
    вокруг модели.
*/

let orbitYaw = 0;

let orbitPitch = 0;

let orbitDistance = 4;


/*
    Начальное положение.
*/

orbitYaw = 0;

orbitPitch = 0;


/*
    Обновление камеры.
*/

function updateOrbitCamera() {

    /*
        XR сейчас управляет камерой.
        В таком случае обычную камеру
        НЕ трогаем.
    */

    if (renderer.xr.isPresenting) {
        return;
    }


    /*
        Ограничиваем вертикальный угол.
    */

    orbitPitch =
        Math.max(
            -1.45,
            Math.min(
                1.45,
                orbitPitch
            )
        );


    /*
        Сферические координаты.
    */

    const x =
        Math.sin(orbitYaw) *
        Math.cos(orbitPitch) *
        orbitDistance;

    const y =
        Math.sin(orbitPitch) *
        orbitDistance;

    const z =
        Math.cos(orbitYaw) *
        Math.cos(orbitPitch) *
        orbitDistance;


    camera.position.set(
        x,
        y,
        z
    );


    camera.lookAt(
        target
    );
}


/* =========================================================
   MOUSE / TOUCH
========================================================= */

let dragging = false;

let lastX = 0;
let lastY = 0;


renderer.domElement.addEventListener(
    "pointerdown",
    function(e) {

        dragging = true;

        lastX = e.clientX;
        lastY = e.clientY;

    }
);


renderer.domElement.addEventListener(
    "pointermove",
    function(e) {

        if (!dragging) {
            return;
        }

        const dx =
            e.clientX - lastX;

        const dy =
            e.clientY - lastY;

        lastX =
            e.clientX;

        lastY =
            e.clientY;


        /*
            Горизонтальное движение:
            вращение вокруг объекта.
        */

        orbitYaw -=
            dx * 0.008;


        /*
            Вертикальное движение:
            наклон камеры.
        */

        orbitPitch +=
            dy * 0.008;


        updateOrbitCamera();

    }
);


window.addEventListener(
    "pointerup",
    function() {

        dragging = false;

    }
);


/* =========================================================
   КОЛЕСО МЫШИ
========================================================= */

renderer.domElement.addEventListener(
    "wheel",
    function(e) {

        orbitDistance +=
            e.deltaY * 0.003;


        orbitDistance =
            Math.max(
                1,
                Math.min(
                    15,
                    orbitDistance
                )
            );


        updateOrbitCamera();

    }
);


/* =========================================================
   ТЕЛЕФОН
========================================================= */


/*
    Данные телефона.
*/

let phoneAlpha = 0;
let phoneBeta = 0;
let phoneGamma = 0;


/*
    Начальная ориентация.

    Она нужна, чтобы при включении
    датчиков модель не прыгала.
*/

let startAlpha = null;
let startBeta = null;
let startGamma = null;


/*
    Quaternion телефона.
*/

const phoneQuaternion =
    new THREE.Quaternion();


/*
    Euler.
*/

const phoneEuler =
    new THREE.Euler(
        0,
        0,
        0,
        "YXZ"
    );


/*
    Для плавности.
*/

const phoneTargetQuaternion =
    new THREE.Quaternion();


/* =========================================================
   DEVICE ORIENTATION
========================================================= */

function handleOrientation(event) {

    if (
        event.alpha === null ||
        event.beta === null ||
        event.gamma === null
    ) {
        return;
    }


    phoneAlpha =
        THREE.MathUtils.degToRad(
            event.alpha
        );

    phoneBeta =
        THREE.MathUtils.degToRad(
            event.beta
        );

    phoneGamma =
        THREE.MathUtils.degToRad(
            event.gamma
        );


    /*
        Запоминаем положение телефона
        в момент запуска.
    */

    if (startAlpha === null) {

        startAlpha =
            phoneAlpha;

        startBeta =
            phoneBeta;

        startGamma =
            phoneGamma;
    }


    /*
        Относительное вращение.
    */

    const alpha =
        phoneAlpha -
        startAlpha;

    const beta =
        phoneBeta -
        startBeta;

    const gamma =
        phoneGamma -
        startGamma;


    /*
        Преобразование ориентации
        телефона в Quaternion.

        Это важная часть:
        мы не просто вращаем модель
        по одному углу, а используем
        полную ориентацию устройства.
    */

    phoneEuler.set(
        beta,
        alpha,
        -gamma,
        "YXZ"
    );

    phoneTargetQuaternion
        .setFromEuler(
            phoneEuler
        );


    /*
        Показываем реальные данные.
    */

    phoneData.innerHTML =
        "alpha: " +
        THREE.MathUtils.radToDeg(alpha).toFixed(1) +
        "°<br>" +

        "beta: " +
        THREE.MathUtils.radToDeg(beta).toFixed(1) +
        "°<br>" +

        "gamma: " +
        THREE.MathUtils.radToDeg(gamma).toFixed(1) +
        "°<br>" +

        "camera: " +
        orbitYaw.toFixed(2);
}


/* =========================================================
   ЗАПУСК ДАТЧИКОВ
========================================================= */

async function enablePhoneSensors() {

    /*
        iPhone требует разрешение
        через пользовательский клик.
    */

    if (
        typeof DeviceOrientationEvent !==
        "undefined" &&

        typeof DeviceOrientationEvent.requestPermission ===
        "function"
    ) {

        try {

            const permission =
                await DeviceOrientationEvent
                    .requestPermission();

            if (
                permission !==
                "granted"
            ) {

                status.textContent =
                    "Доступ к датчикам запрещен";

                return;
            }

        } catch(error) {

            console.error(error);

            return;
        }
    }


    /*
        Сбрасываем начальное положение.
    */

    startAlpha = null;
    startBeta = null;
    startGamma = null;


    window.addEventListener(
        "deviceorientation",
        handleOrientation,
        true
    );


    status.textContent =
        "Датчики телефона активны";


    sensorButton.style.display =
        "none";
}


/* =========================================================
   КНОПКА ДАТЧИКОВ
========================================================= */

sensorButton.addEventListener(
    "click",
    enablePhoneSensors
);


/*
    На мобильном устройстве показываем
    кнопку запуска датчиков.
*/

if (
    /Android|iPhone|iPad|iPod/i.test(
        navigator.userAgent
    )
) {

    sensorButton.style.display =
        "block";
}


/* =========================================================
   AR
========================================================= */

arButton.addEventListener(
    "click",
    async function() {

        if (!navigator.xr) {

            status.textContent =
                "WebXR не поддерживается этим браузером";

            return;
        }


        try {

            const supported =
                await navigator.xr.isSessionSupported(
                    "immersive-ar"
                );

            if (!supported) {

                status.textContent =
                    "AR не поддерживается устройством";

                return;
            }


            const session =
                await navigator.xr.requestSession(
                    "immersive-ar",
                    {
                        requiredFeatures: [
                            "local-floor"
                        ]
                    }
                );


            renderer.xr.setReferenceSpaceType(
                "local-floor"
            );


            await renderer.xr.setSession(
                session
            );


            status.textContent =
                "AR активен. Двигайтесь вокруг модели.";


            session.addEventListener(
                "end",
                function() {

                    status.textContent =
                        "AR завершен";

                    updateOrbitCamera();

                }
            );


        } catch(error) {

            console.error(
                "AR ERROR:",
                error
            );

            status.textContent =
                "Ошибка запуска AR: " +
                error.message;
        }

    }
);


/* =========================================================
   ЦЕНТРИРОВАНИЕ
========================================================= */

resetButton.addEventListener(
    "click",
    function() {

        orbitYaw = 0;

        orbitPitch = 0;

        orbitDistance = 4;


        startAlpha = null;
        startBeta = null;
        startGamma = null;


        updateOrbitCamera();

    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================================================
   ANIMATION
========================================================= */

function animate() {

    /*
        Плавно приближаем ориентацию
        камеры к ориентации телефона.
    */

    if (
        !renderer.xr.isPresenting &&
        startAlpha !== null
    ) {

        phoneQuaternion.slerp(
            phoneTargetQuaternion,
            0.15
        );


        /*
            Ориентация телефона
            управляет горизонтальным
            вращением сцены.
        */

        const euler =
            new THREE.Euler()
                .setFromQuaternion(
                    phoneQuaternion,
                    "YXZ"
                );


        orbitYaw =
            -euler.y;


        orbitPitch =
            -euler.x;


        updateOrbitCamera();
    }


    renderer.render(
        scene,
        camera
    );
}


renderer.setAnimationLoop(
    animate
);


/* =========================================================
   START
========================================================= */

updateOrbitCamera();

</script>

</body>
</html>
