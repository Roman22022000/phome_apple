<!DOCTYPE html>

<html lang="ru">
<head>
    <meta charset="UTF-8">

```
<meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
>

<title>AR Gallery</title>

<!-- Telegram Mini App -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- TON Connect -->
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

<!-- Three.js -->
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;
    }

    body {
        touch-action: none;
    }

    button,
    input {
        font: inherit;
    }

    button {
        border: 0;
        outline: 0;
        cursor: pointer;
    }

    /* ================================
       SCREENS
    ================================= */

    .screen {
        position: fixed;
        inset: 0;

        width: 100%;
        height: 100%;

        display: none;

        background: #000;
    }

    .screen.active {
        display: flex;
    }

    /* ================================
       LOGIN
    ================================= */

    #loginScreen {
        align-items: center;
        justify-content: center;

        padding:
            max(20px, env(safe-area-inset-top))
            20px
            max(20px, env(safe-area-inset-bottom))
            20px;
    }

    .loginContent {
        width: min(420px, 100%);

        display: flex;
        flex-direction: column;
        align-items: center;

        gap: 18px;
    }

    .logo {
        width: 100px;
        height: 100px;

        display: flex;
        align-items: center;
        justify-content: center;

        border: 1px solid #333;
        border-radius: 50%;

        background:
            radial-gradient(
                circle,
                #292929,
                #050505
            );

        font-size: 40px;
    }

    .title {
        font-size: clamp(30px, 8vw, 48px);
        font-weight: 600;
        text-align: center;
    }

    .subtitle {
        max-width: 320px;

        color: #888;

        font-size: 14px;
        line-height: 1.5;

        text-align: center;
    }

    #ton-connect {
        min-height: 50px;
        margin-top: 10px;
    }

    .loginStatus {
        min-height: 20px;

        color: #888;

        font-size: 13px;
        text-align: center;
    }

    /* ================================
       MENU
    ================================= */

    #menuScreen {
        align-items: center;
        justify-content: center;

        padding: 20px;
    }

    .menuContent {
        width: min(420px, 100%);

        display: flex;
        flex-direction: column;

        gap: 12px;
    }

    .menuTitle {
        margin-bottom: 18px;

        font-size: 30px;
        font-weight: 600;

        text-align: center;
    }

    .walletInfo {
        margin-bottom: 10px;

        padding: 12px;

        border: 1px solid #222;
        border-radius: 12px;

        color: #777;

        font-size: 11px;

        text-align: center;

        word-break: break-all;
    }

    .menuButton {
        width: 100%;
        min-height: 56px;

        border-radius: 15px;

        background: #151515;
        border: 1px solid #292929;

        color: #fff;

        font-size: 16px;
    }

    .menuButton:active {
        transform: scale(.97);
    }

    /* ================================
       GENERATION
    ================================= */

    #generationScreen {
        align-items: center;
        justify-content: center;

        padding: 20px;
    }

    .generationContent {
        width: min(420px, 100%);

        display: flex;
        flex-direction: column;

        gap: 18px;
    }

    .screenHeader {
        width: 100%;

        display: flex;
        align-items: center;
    }

    .backButton {
        width: 44px;
        height: 44px;

        flex-shrink: 0;

        border-radius: 13px;

        background: #181818;
        color: #fff;

        font-size: 28px;
    }

    .screenTitle {
        flex: 1;

        margin-right: 44px;

        font-size: 21px;
        font-weight: 600;

        text-align: center;
    }

    .generationCard {
        width: 100%;

        padding: 24px;

        border: 1px solid #292929;
        border-radius: 20px;

        background: #111;
    }

    .generationLabel {
        display: block;

        margin-bottom: 10px;

        color: #999;

        font-size: 13px;
    }

    #generationCode {
        width: 100%;
        height: 62px;

        padding: 0 18px;

        border: 1px solid #333;
        border-radius: 15px;

        outline: none;

        background: #050505;
        color: #fff;

        font-size: 25px;
        letter-spacing: 7px;

        text-align: center;
    }

    #generationCode:focus {
        border-color: #666;
    }

    #generationCode::placeholder {
        color: #444;
    }

    #generationSubmit {
        width: 100%;
        min-height: 56px;

        margin-top: 14px;

        border-radius: 15px;

        background: #fff;
        color: #000;

        font-size: 16px;
        font-weight: 600;
    }

    #generationSubmit:disabled {
        opacity: .35;
        cursor: default;
    }

    #generationStatus {
        min-height: 22px;

        margin-top: 12px;

        color: #999;

        font-size: 13px;
        line-height: 1.4;

        text-align: center;
    }

    /* ================================
       GALLERY
    ================================= */

    #galleryScreen {
        flex-direction: column;

        padding:
            max(12px, env(safe-area-inset-top))
            20px
            max(20px, env(safe-area-inset-bottom))
            20px;
    }

    .galleryHeader {
        width: 100%;
        height: 60px;

        display: flex;
        align-items: center;
    }

    .galleryTitle {
        flex: 1;

        font-size: 21px;
        font-weight: 600;

        text-align: center;
    }

    .galleryGrid {
        width: 100%;
        max-width: 600px;

        margin: auto;

        display: grid;

        grid-template-columns:
            repeat(
                auto-fit,
                minmax(100px, 1fr)
            );

        gap: 14px;

        align-content: center;
    }

    .numberButton {
        aspect-ratio: 1;

        border-radius: 22px;

        border: 1px solid #2b2b2b;

        background: #151515;
        color: #fff;

        font-size: clamp(30px, 9vw, 52px);
    }

    .numberButton:active {
        transform: scale(.94);
    }

    /* ================================
       VIEWER
    ================================= */

    #viewerScreen {
        background: #000;
    }

    #canvasContainer {
        position: absolute;
        inset: 0;

        width: 100%;
        height: 100%;
    }

    #canvasContainer canvas {
        display: block;

        width: 100%;
        height: 100%;
    }

    .viewerTop {
        position: absolute;

        z-index: 20;

        top: max(12px, env(safe-area-inset-top));
        left: 12px;
        right: 12px;

        height: 50px;

        display: flex;
        align-items: center;
    }

    .viewerBack {
        width: 44px;
        height: 44px;

        border-radius: 13px;

        background: rgba(20,20,20,.75);
        color: #fff;

        font-size: 28px;

        backdrop-filter: blur(12px);
    }

    .galleryNavigation {
        position: absolute;

        left: 50%;

        transform: translateX(-50%);

        display: flex;
        align-items: center;

        gap: 7px;

        padding: 4px;

        border-radius: 15px;

        background: rgba(20,20,20,.72);

        backdrop-filter: blur(12px);
    }

    .galleryArrow {
        width: 42px;
        height: 42px;

        border-radius: 12px;

        background: rgba(255,255,255,.08);
        color: #fff;

        font-size: 27px;
    }

    .currentGallery {
        min-width: 42px;

        color: #fff;

        font-size: 15px;
        font-weight: 600;

        text-align: center;
    }

    /* ================================
       DESCRIPTION
    ================================= */

    .descriptionPanel {
        position: absolute;

        z-index: 25;

        top:
            calc(
                max(12px, env(safe-area-inset-top))
                \+ 58px
            );

        left: 50%;

        transform: translateX(-50%);

        width: min(92vw, 520px);

        border: 1px solid rgba(255,255,255,.08);
        border-radius: 16px;

        background: rgba(18,18,18,.82);

        overflow: hidden;

        backdrop-filter: blur(14px);
    }

    .descriptionHeader {
        width: 100%;
        min-height: 44px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 14px;

        background: transparent;
        color: #fff;

        font-size: 14px;
        font-weight: 600;
    }

    .descriptionBody {
        max-height: 0;

        overflow: hidden;

        padding: 0 14px;

        color: rgba(255,255,255,.72);

        font-size: 13px;
        line-height: 1.55;

        transition:
            max-height .25s ease,
            padding .25s ease;
    }

    .descriptionPanel.expanded .descriptionBody {
        max-height: 42vh;

        overflow-y: auto;

        padding:
            0
            14px
            14px;
    }

    /* ================================
       LOADER
    ================================= */

    .loader {
        position: absolute;

        z-index: 50;

        inset: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #000;
    }

    .loader.hidden {
        display: none;
    }

    .loaderText {
        color: #aaa;

        font-size: 14px;
    }

    @media (orientation: landscape) {
        .galleryGrid {
            grid-template-columns:
                repeat(3, 130px);

            justify-content: center;
        }
    }
</style>
```

</head>

<body>

```
<!-- =========================================
     LOGIN
========================================== -->

<section
    id="loginScreen"
    class="screen active"
>

    <div class="loginContent">

        <div class="logo">
            ◇
        </div>

        <div class="title">
            AR Gallery
        </div>

        <div class="subtitle">
            Галерея цифровых существ
            в интерактивном 3D-пространстве
        </div>

        <div id="ton-connect"></div>

        <div
            id="loginStatus"
            class="loginStatus"
        >
            Подключите TON-кошелёк
        </div>

    </div>

</section>


<!-- =========================================
     MENU
========================================== -->

<section
    id="menuScreen"
    class="screen"
>

    <div class="menuContent">

        <div class="menuTitle">
            AR Gallery
        </div>

        <div
            id="walletInfo"
            class="walletInfo"
        >
            Кошелёк не подключён
        </div>

        <button
            id="openGallery"
            class="menuButton"
            type="button"
        >
            Галерея
        </button>

        <button
            id="generationButton"
            class="menuButton"
            type="button"
        >
            Генерация
        </button>

        <button
            id="combineButton"
            class="menuButton"
            type="button"
        >
            Объединить
        </button>

        <button
            id="treeButton"
            class="menuButton"
            type="button"
        >
            Дерево
        </button>

        <button
            id="marketButton"
            class="menuButton"
            type="button"
        >
            Маркет
        </button>

    </div>

</section>


<!-- =========================================
     GENERATION
========================================== -->

<section
    id="generationScreen"
    class="screen"
>

    <div class="generationContent">

        <div class="screenHeader">

            <button
                id="generationBack"
                class="backButton"
                type="button"
            >
                ‹
            </button>

            <div class="screenTitle">
                Генерация
            </div>

        </div>


        <div class="generationCard">

            <label
                class="generationLabel"
                for="generationCode"
            >
                Введите 5 цифр
            </label>

            <input
                id="generationCode"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                maxlength="5"
                pattern="[0-9]{5}"
                placeholder="00000"
            >

            <button
                id="generationSubmit"
                type="button"
                disabled
            >
                Отправить
            </button>

            <div
                id="generationStatus"
                aria-live="polite"
            ></div>

        </div>

    </div>

</section>


<!-- =========================================
     GALLERY
========================================== -->

<section
    id="galleryScreen"
    class="screen"
>

    <div class="galleryHeader">

        <button
            id="galleryBack"
            class="backButton"
            type="button"
        >
            ‹
        </button>

        <div class="galleryTitle">
            Галерея
        </div>

    </div>


    <div class="galleryGrid">

        <button
            class="numberButton"
            data-index="0"
            type="button"
        >
            1
        </button>

        <button
            class="numberButton"
            data-index="1"
            type="button"
        >
            2
        </button>

        <button
            class="numberButton"
            data-index="2"
            type="button"
        >
            3
        </button>

    </div>

</section>


<!-- =========================================
     3D VIEWER
========================================== -->

<section
    id="viewerScreen"
    class="screen"
>

    <div id="canvasContainer"></div>


    <div class="viewerTop">

        <button
            id="viewerBack"
            class="viewerBack"
            type="button"
        >
            ‹
        </button>


        <div class="galleryNavigation">

            <button
                id="prevGallery"
                class="galleryArrow"
                type="button"
            >
                ‹
            </button>

            <div
                id="currentGallery"
                class="currentGallery"
            >
                1
            </div>

            <button
                id="nextGallery"
                class="galleryArrow"
                type="button"
            >
                ›
            </button>

        </div>

    </div>


    <div
        id="descriptionPanel"
        class="descriptionPanel"
    >

        <button
            id="descriptionHeader"
            class="descriptionHeader"
            type="button"
        >
            <span>Описание</span>
            <span>⌄</span>
        </button>

        <div
            id="descriptionBody"
            class="descriptionBody"
        ></div>

    </div>


    <div
        id="loader"
        class="loader hidden"
    >

        <div
            id="loaderText"
            class="loaderText"
        >
            Загрузка 3D модели...
        </div>

    </div>

</section>


<!-- MAIN JAVASCRIPT -->
<script
    type="module"
    src="./script.js"
></script>
```

</body>
</html>
