<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="
        width=device-width,
        initial-scale=1,
        maximum-scale=1,
        user-scalable=no,
        viewport-fit=cover
    "
>

<title>AR Gallery</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script src="https://unpkg.com/@tonconnect/ui@2.1.0/dist/tonconnect-ui.min.js"></script>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    touch-action: none;
}

button {
    border: 0;
    outline: 0;
    font: inherit;
    cursor: pointer;
}

input {
    font: inherit;
}

.screen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
    background: #000;
}

.screen.active {
    display: flex;
}

/* =====================================================
   AUTH
===================================================== */

#authScreen {
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.authContent {
    width: min(420px, 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
}

.authLogo {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 1px solid #333;
    background:
        radial-gradient(
            circle,
            #292929,
            #050505
        );
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
}

.authTitle {
    font-size: 34px;
    font-weight: 600;
    text-align: center;
}

.authText {
    max-width: 330px;
    color: #888;
    font-size: 14px;
    line-height: 1.5;
    text-align: center;
}

#ton-connect {
    min-height: 44px;
}

.authStatus {
    min-height: 22px;
    color: #888;
    font-size: 13px;
    text-align: center;
}

.authError {
    max-width: 340px;
    color: #ff6666;
    font-size: 13px;
    line-height: 1.45;
    text-align: center;
}

/* =====================================================
   HOME
===================================================== */

#homeScreen {
    align-items: center;
    justify-content: center;
    padding:
        max(20px, env(safe-area-inset-top))
        20px
        max(20px, env(safe-area-inset-bottom))
        20px;
}

.homeContent {
    width: min(500px, 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
}

.logo {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #333;
    background:
        radial-gradient(
            circle,
            #292929,
            #050505
        );
    font-size: 42px;
}

.title {
    font-size: clamp(30px, 8vw, 48px);
    font-weight: 600;
    text-align: center;
}

.subtitle {
    max-width: 320px;
    color: #888;
    font-size: 15px;
    line-height: 1.5;
    text-align: center;
    margin-bottom: 6px;
}

.walletInfo {
    width: min(360px, 100%);
    padding: 10px 14px;
    border: 1px solid #252525;
    border-radius: 12px;
    background: #0b0b0b;
    color: #777;
    font-size: 11px;
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.nftAccess {
    color: #777;
    font-size: 12px;
}

.mainButton {
    width: min(320px, 100%);
    min-height: 56px;
    border-radius: 16px;
    background: #fff;
    color: #000;
    font-size: 16px;
    font-weight: 600;
}

.mainButton:active {
    transform: scale(.97);
}

/* =====================================================
   GENERATION
===================================================== */

#generationScreen {
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.generationContent {
    width: min(420px, 100%);
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 18px;
}

.generationHeader {
    display: flex;
    align-items: center;
    gap: 12px;
}

.generationHeader .backButton {
    flex: 0 0 auto;
}

.generationTitle {
    flex: 1;
    text-align: center;
    font-size: 21px;
    font-weight: 600;
    margin-right: 44px;
}

.generationCard {
    width: 100%;
    padding: 24px;
    border-radius: 22px;
    background: #111;
    border: 1px solid #2a2a2a;
}

.generationLabel {
    display: block;
    margin-bottom: 10px;
    color: #999;
    font-size: 13px;
}

.codeInputWrap {
    display: flex;
    align-items: center;
    width: 100%;
    height: 60px;
    border-radius: 16px;
    background: #050505;
    border: 1px solid #333;
    overflow: hidden;
}

.codePrefix {
    padding-left: 18px;
    color: #888;
    font-size: 22px;
}

#generationCode {
    width: 100%;
    height: 100%;
    padding: 0 16px 0 8px;
    border: 0;
    outline: 0;
    background: transparent;
    color: #fff;
    font-size: 24px;
    letter-spacing: 6px;
}

#generationCode::placeholder {
    color: #444;
    letter-spacing: 4px;
}

.generationSubmit {
    width: 100%;
    min-height: 56px;
    margin-top: 14px;
    border-radius: 16px;
    background: #fff;
    color: #000;
    font-size: 16px;
    font-weight: 600;
}

.generationSubmit:disabled {
    opacity: .45;
    cursor: default;
}

#generationStatus {
    min-height: 20px;
    margin-top: 12px;
    color: #999;
    font-size: 13px;
    line-height: 1.4;
    text-align: center;
}

/* =====================================================
   GALLERY
===================================================== */

#galleryScreen {
    flex-direction: column;
    padding:
        max(12px, env(safe-area-inset-top))
        20px
        max(20px, env(safe-area-inset-bottom))
        20px;
}

.galleryHeader {
    width: 100%;
    height: 60px;
    display: flex;
    align-items: center;
}

.backButton {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    background: #181818;
    color: #fff;
    font-size: 28px;
}

.galleryTitle {
    flex: 1;
    text-align: center;
    font-size: 21px;
    font-weight: 600;
}

.galleryGrid {
    width: 100%;
    max-width: 600px;
    margin: auto;
    display: grid;
    grid-template-columns:
        repeat(
            auto-fit,
            minmax(100px, 1fr)
        );
    gap: 14px;
    align-content: center;
}

.numberButton {
    aspect-ratio: 1;
    border-radius: 24px;
    background: #151515;
    border: 1px solid #2b2b2b;
    color: #fff;
    font-size: clamp(30px, 9vw, 52px);
    font-weight: 500;
}

.numberButton:active {
    transform: scale(.94);
}

/* =====================================================
   VIEWER
===================================================== */

#viewerScreen {
    background: #000;
}

#canvasContainer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

.viewerTop {
    position: absolute;
    z-index: 20;
    top: max(12px, env(safe-area-inset-top));
    left: 12px;
    right: 12px;
    height: 50px;
    display: flex;
    align-items: center;
}

.viewerBack {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    border-radius: 14px;
    background: rgba(20,20,20,.75);
    color: #fff;
    font-size: 28px;
    backdrop-filter: blur(12px);
}

.galleryNavigation {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px;
    border-radius: 16px;
    background: rgba(20,20,20,.72);
    backdrop-filter: blur(12px);
}

.galleryArrow {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: rgba(255,255,255,.08);
    color: #fff;
    font-size: 28px;
}

.currentGallery {
    min-width: 42px;
    text-align: center;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
}

.descriptionPanel {
    position: absolute;
    z-index: 25;
    top: calc(max(12px, env(safe-area-inset-top)) + 58px);
    left: 50%;
    transform: translateX(-50%);
    width: min(92vw, 520px);
    border-radius: 16px;
    background: rgba(18,18,18,.82);
    border: 1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(14px);
    overflow: hidden;
}

.descriptionHeader {
    width: 100%;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    background: transparent;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    text-align: left;
}

.descriptionChevron {
    font-size: 18px;
    opacity: .65;
    transition: transform .2s ease;
}

.descriptionPanel.expanded .descriptionChevron {
    transform: rotate(180deg);
}

.descriptionBody {
    max-height: 0;
    overflow: hidden;
    padding: 0 14px;
    color: rgba(255,255,255,.72);
    font-size: 13px;
    line-height: 1.55;
    transition:
        max-height .25s ease,
        padding .25s ease;
}

.descriptionPanel.expanded .descriptionBody {
    max-height: 42vh;
    overflow-y: auto;
    padding: 0 14px 14px;
}

.loader {
    position: absolute;
    z-index: 50;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
}

.loader.hidden {
    display: none;
}

.loaderText {
    color: #aaa;
    font-size: 14px;
}

@media (orientation: landscape) {

    .galleryGrid {
        grid-template-columns:
            repeat(3, 130px);

        justify-content: center;
    }

}

</style>

</head>

     AUTH
===================================================== -->

>

    <div class="authContent">

        <div class="authText">
            Для входа подключите TON-кошелёк.

        <div id="ton-connect"></div>

            id="authStatus"

            id="authError"
            class="authError"
        ></div>

    </div>

</section>


<!-- =====================================================
     HOME
===================================================== -->

<section
    id="homeScreen"
    class="screen"
>

    <div class="homeContent">

        <div class="logo">
            ◇
        </div>

        <div class="title">
            AR Gallery

        </div>

        <div

        </div>

        <button

            class="mainButton"
        >
            Открытие галереи
        </button>

        <button
            id="generationButton"
            class="mainButton"
            type="button"
        >
            Генерация
        </button>

        <button

            class="mainButton"

        >
            Объединить

        <button
            id="treeButton"

        >

        <button

<!-- =====================================================

    <div class="generationContent">

            <button
                id="generationBack"

        <div class="generationCard">

===================================================== -->

<section

<script type="module">

import * as THREE
    from "three";

import {
    GLTFLoader
}
from "three/addons/loaders/GLTFLoader.js";

import {
    OrbitControls
}
from "three/addons/controls/OrbitControls.js";


/* =====================================================
   TELEGRAM
===================================================== */

const tg =
    window.Telegram?.WebApp || null;

if (tg) {

    tg.ready();
    tg.expand();

    if (tg.setHeaderColor) {
        tg.setHeaderColor("#000000");
    }

    if (tg.setBackgroundColor) {
        tg.setBackgroundColor("#000000");
    }

}


/* =====================================================
   TON CONFIGURATION
===================================================== */

/*
    TON Connect manifest
*/

const TON_MANIFEST =
    "https://roman22022000.github.io/Ton_site/tonconnect-manifest.json";


/*
    ВАЖНО:

    Это адрес коллекции из твоей
    ссылки Getgems:

    https://getgems.io/collection/
    EQD9mm3hx-QvHYNg18gDaaJtSTTQTVVYjJ6zhonXocj2eyI
*/

const REQUIRED_COLLECTION =
    "EQD9mm3hx-QvHYNg18gDaaJtSTTQTVVYjJ6zhonXocj2eyI";


/*
    TON Connect
*/

const tonConnectUI =
    new TON_CONNECT_UI.TonConnectUI({

        manifestUrl:
            TON_MANIFEST,

        buttonRootId:
            "ton-connect"

    });


/*
    Текущий кошелёк
*/

let walletAddress = null;


/*
    Найден ли NFT коллекции
*/

let nftAccessGranted = false;


/* =====================================================
   AUTH ELEMENTS
===================================================== */

const authScreen =
    document.getElementById(
        "authScreen"
    );

const authStatus =
    document.getElementById(
        "authStatus"
    );

const authError =
    document.getElementById(
        "authError"
    );

const walletInfo =
    document.getElementById(
        "walletInfo"
    );

const nftAccess =
    document.getElementById(
        "nftAccess"
    );


/* =====================================================
   SCREEN ELEMENTS
===================================================== */

const homeScreen =
    document.getElementById(
        "homeScreen"
    );

const galleryScreen =
    document.getElementById(
        "galleryScreen"
    );

const viewerScreen =
    document.getElementById(
        "viewerScreen"
    );

const generationScreen =
    document.getElementById(
        "generationScreen"
    );

const generationButton =
    document.getElementById(
        "generationButton"
    );

const generationBack =
    document.getElementById(
        "generationBack"
    );

const generationCode =
    document.getElementById(
        "generationCode"
    );

const generationSubmit =
    document.getElementById(
        "generationSubmit"
    );

const generationStatus =
    document.getElementById(
        "generationStatus"
    );


/* =====================================================
   SCREEN NAVIGATION
===================================================== */

function showScreen(screen) {

    document
        .querySelectorAll(".screen")
        .forEach(
            element => {

                element.classList.remove(
                    "active"
                );

            }
        );

    screen.classList.add(
        "active"
    );

}


/* =====================================================
   NFT CHECK
===================================================== */

/*
    Проверяем NFT конкретного кошелька.

    Условие доступа:

    хотя бы один NFT,
    у которого collection.address
    совпадает с REQUIRED_COLLECTION.
*/

async function checkNFT(wallet) {

    if (!wallet) {
        return false;
    }

    try {

        authStatus.textContent =
            "Проверка NFT...";

        authError.textContent = "";

        nftAccessGranted = false;

        const url =
            "https://tonapi.io/v2/accounts/" +
            encodeURIComponent(wallet) +
            "/nfts?limit=1000";


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "TON API: " +
                response.status
            );

        }


        const data =
            await response.json();


        const nfts =
            Array.isArray(
                data.nft_items
            )
                ? data.nft_items
                : [];


        console.log(
            "NFT кошелька:",
            nfts
        );


        /*
            Ищем ЛЮБОЙ NFT
            из нужной коллекции.
        */

        const collectionNFT =
            nfts.find(
                nft => {

                    const collectionAddress =
                        nft.collection?.address ||
                        nft.collection_address ||
                        null;

                    return (
                        collectionAddress &&
                        collectionAddress ===
                            REQUIRED_COLLECTION
                    );

                }
            );


        /*
            NFT найден.
        */

        if (collectionNFT) {

            nftAccessGranted = true;

            authStatus.textContent =
                "NFT найден. Доступ разрешён.";

            authError.textContent = "";

            nftAccess.textContent =
                "NFT коллекции найден";

            return true;

        }


        /*
            NFT не найден.
        */

        nftAccessGranted = false;

        authStatus.textContent =
            "NFT коллекции не найден";

        authError.textContent =
            "В подключённом кошельке нет NFT из необходимой коллекции.";

        nftAccess.textContent =
            "NFT коллекции не найден";

        return false;

    }
    catch (error) {

        console.error(
            "NFT CHECK ERROR:",
            error
        );

        nftAccessGranted = false;

        authStatus.textContent =
            "Ошибка проверки NFT";

        authError.textContent =
            "Не удалось проверить содержимое кошелька.";

        nftAccess.textContent =
            "Ошибка проверки NFT";

        return false;

    }

}


/* =====================================================
   TON WALLET STATUS
===================================================== */

tonConnectUI.onStatusChange(
    async wallet => {

        authError.textContent = "";


        /*
            Кошелёк отключён.
        */

        if (!wallet) {

            walletAddress = null;

            nftAccessGranted = false;

            authStatus.textContent =
                "Подключите кошелёк";

            walletInfo.textContent =
                "Кошелёк не подключён";

            nftAccess.textContent =
                "NFT коллекции не найден";

            showScreen(
                authScreen
            );

            return;

        }


        /*
            Получаем адрес.
        */

        walletAddress =
            wallet.account?.address ||
            null;


        if (!walletAddress) {

            nftAccessGranted = false;

            authStatus.textContent =
                "Адрес кошелька не найден";

            showScreen(
                authScreen
            );

            return;

        }


        walletInfo.textContent =
            walletAddress;


        /*
            Проверяем NFT.
        */

        const allowed =
            await checkNFT(
                walletAddress
            );


        /*
            Есть NFT коллекции.
        */

        if (allowed) {

            showScreen(
                homeScreen
            );

            return;

        }


        /*
            Нет NFT коллекции.
        */

        showScreen(
            authScreen
        );

    }

                                "application/json"
                        },

                        body: JSON.stringify({

                error.message ||

/* =====================================================
   MULTI TOUCH
===================================================== */

let multiTouchMode = null;

let pinchStartDistance = 0;

let pinchStartCameraDistance = 0;

let threeFingerLastX = 0;

let threeFingerLastY = 0;


function getTouchDistance(
    touches
) {

    const a = touches[0];

    const b = touches[1];

    return Math.hypot(
        b.clientX - a.clientX,
        b.clientY - a.clientY
    );

}


function getTouchCenter(
    touches
) {

    let x = 0;

    let y = 0;

    for (
        let i = 0;
        i < touches.length;
        i++
    ) {

        x +=
            touches[i].clientX;

        y +=
            touches[i].clientY;

    }

    return {

        x:
            x / touches.length,

        y:
            y / touches.length

    };

}


function initMultiTouchControls() {

    const element =
        renderer.domElement;


    element.addEventListener(
        "touchstart",
        onMultiTouchStart,
        { passive: false }
    );


    element.addEventListener(
        "touchmove",
        onMultiTouchMove,
        { passive: false }
    );


    element.addEventListener(
        "touchend",
        onMultiTouchEnd,
        { passive: false }
    );


    element.addEventListener(
        "touchcancel",
        onMultiTouchEnd,
        { passive: false }
    );

}


function onMultiTouchStart(
    event
) {

    if (
        event.touches.length === 2
    ) {

        multiTouchMode =
            "pinch";

        pinchStartDistance =
            getTouchDistance(
                event.touches
            );

        pinchStartCameraDistance =
            camera.position.distanceTo(
                controls.target
            );

        controls.enabled = false;

        event.preventDefault();

        return;

    }


    if (
        event.touches.length >= 3
    ) {

        const center =
            getTouchCenter(
                event.touches
            );

        multiTouchMode =
            "pan";

        threeFingerLastX =
            center.x;

        threeFingerLastY =
            center.y;

        controls.enabled = false;

        event.preventDefault();

    }

}


function onMultiTouchMove(
    event
) {

    if (
        !camera ||
        !controls
    ) {

        return;

    }


    if (
        event.touches.length === 2 &&
        multiTouchMode === "pinch"
    ) {

        const distance =
            getTouchDistance(
                event.touches
            );


        if (
            distance > 0 &&
            pinchStartDistance > 0
        ) {

            const scale =
                pinchStartDistance /
                distance;


            const newDistance =
                THREE.MathUtils.clamp(

                    pinchStartCameraDistance *
                        scale,

                    controls.minDistance,

                    controls.maxDistance

                );


            const direction =
                new THREE.Vector3()
                    .subVectors(
                        camera.position,
                        controls.target
                    )
                    .normalize();


            camera.position.copy(

                controls.target
                    .clone()
                    .add(
                        direction.multiplyScalar(
                            newDistance
                        )
                    )

            );

        }


        event.preventDefault();

        return;

    }


    if (
        event.touches.length >= 3 &&
        multiTouchMode === "pan"
    ) {

        const center =
            getTouchCenter(
                event.touches
            );


        const dx =
            center.x -
            threeFingerLastX;


        const dy =
            center.y -
            threeFingerLastY;


        threeFingerLastX =
            center.x;

        threeFingerLastY =
            center.y;


        const distance =
            camera.position.distanceTo(
                controls.target
            );


        const panSpeed =
            distance * 0.0025;


        const right =
            new THREE.Vector3()
                .setFromMatrixColumn(
                    camera.matrixWorld,
                    0
                )
                .normalize();


        const up =
            new THREE.Vector3()
                .setFromMatrixColumn(
                    camera.matrixWorld,
                    1
                )
                .normalize();


        const movement =
            new THREE.Vector3()
                .addScaledVector(
                    right,
                    -dx * panSpeed
                )
                .addScaledVector(
                    up,
                    dy * panSpeed
                );


        camera.position.add(
            movement
        );

        controls.target.add(
            movement
        );


        event.preventDefault();

    }

}


function onMultiTouchEnd(
    event
) {

    if (
        event.touches.length === 2
    ) {

        multiTouchMode =
            "pinch";

        pinchStartDistance =
            getTouchDistance(
                event.touches
            );

        pinchStartCameraDistance =
            camera.position.distanceTo(
                controls.target
            );

        event.preventDefault();

        return;

    }


    if (
        event.touches.length >= 3
    ) {

        const center =
            getTouchCenter(
                event.touches
            );

        multiTouchMode =
            "pan";

        threeFingerLastX =
            center.x;

        threeFingerLastY =
            center.y;

        event.preventDefault();

        return;

    }


    multiTouchMode = null;


    if (!orientationActive) {

        controls.enabled = true;

    }

}


/* =====================================================
   LOAD MODEL
===================================================== */

function loadModel(
    filename
) {

    const loader =
        document.getElementById(
            "loader"
        );

    const loaderText =
        document.getElementById(
            "loaderText"
        );


    loader.classList.remove(
        "hidden"
    );


    loaderText.textContent =
        "Загрузка 3D модели...";


    if (model) {

        scene.remove(
            model
        );


        model.traverse(
            object => {

                if (
                    object.isMesh
                ) {

                    if (
                        object.geometry
                    ) {

                        object.geometry.dispose();

                    }


                    if (
                        Array.isArray(
                            object.material
                        )
                    ) {

                        object.material.forEach(
                            material => {

                                material.dispose();

                            }
                        );

                    }
                    else if (
                        object.material
                    ) {

                        object.material.dispose();

                    }

                }

            }
        );


        model = null;

    }


    const url =
        MODEL_BASE +
        filename;


    gltfLoader.load(

        url,

        gltf => {

            model =
                gltf.scene;


            const box =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            const center =
                box.getCenter(
                    new THREE.Vector3()
                );


            const size =
                box.getSize(
                    new THREE.Vector3()
                );


            model.position.sub(
                center
            );


            const maxSize =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );


            if (
                maxSize > 0
            ) {

                model.scale.setScalar(
                    2 / maxSize
                );

            }


            scene.add(
                model
            );


            resetCamera();


            loader.classList.add(
                "hidden"
            );

        },


        xhr => {

            if (
                xhr.total > 0
            ) {

                const percent =
                    Math.round(
                        xhr.loaded /
                        xhr.total *
                        100
                    );


                loaderText.textContent =
                    `Загрузка ${percent}%`;

            }

        },


        error => {

            console.error(
                "GLB error:",
                error
            );


            loaderText.textContent =
                "Ошибка загрузки модели";

        }

    );

}

/* =====================================================

===================================================== */

async function startSensors() {

    orientationReceived = false;

    initialQuaternion.identity();

    relativeQuaternion.identity();

    sensorYaw = 0;

    sensorPitch = 0;

    targetYaw = 0;

    targetPitch = 0;


    if (
        tg &&
        tg.DeviceOrientation &&
        typeof tg.DeviceOrientation.start ===
            "function"
    ) {

        tg.onEvent(
            "deviceOrientationChanged",
            onTelegramOrientation
        );


        tg.onEvent(
            "deviceOrientationStarted",
            onTelegramOrientationStarted
        );


        tg.onEvent(
            "deviceOrientationFailed",
            onTelegramOrientationFailed
        );


        tg.DeviceOrientation.start({

            refresh_rate: 20,

            need_absolute: false

        });


        orientationActive = true;


        if (controls) {

            controls.enabled = false;

        }


        startTelegramGyroscope();

        return;

    }


    if (
        typeof DeviceOrientationEvent !==
            "undefined"
    ) {

        try {

            if (
                typeof DeviceOrientationEvent
                    .requestPermission ===
                    "function"
            ) {

                const permission =
                    await DeviceOrientationEvent
                        .requestPermission();


                if (
                    permission !==
                    "granted"
                ) {

                    return;

                }

            }


            window.addEventListener(
                "deviceorientation",
                onBrowserOrientation,
                true
            );


            orientationActive = true;


            if (controls) {

                controls.enabled = false;

            }

        }
        catch (error) {

            console.error(
                error
            );

        }

    }

}


function onTelegramOrientationStarted() {

    console.log(
        "Telegram orientation started"
    );

}


function onTelegramOrientationFailed(
    error
) {

    console.error(
        "Telegram orientation failed:",
        error
    );


    orientationActive = false;


    if (controls) {

        controls.enabled = true;

    }

}


function onTelegramOrientation() {

    if (
        !orientationActive ||
        !tg.DeviceOrientation
    ) {

        return;

    }


    const alpha =
        Number(
            tg.DeviceOrientation.alpha
        );


    const beta =
        Number(
            tg.DeviceOrientation.beta
        );


    const gamma =
        Number(
            tg.DeviceOrientation.gamma
        );


    if (
        !Number.isFinite(alpha) ||
        !Number.isFinite(beta) ||
        !Number.isFinite(gamma)
    ) {

        return;

    }


    deviceAlpha = alpha;

    deviceBeta = beta;

    deviceGamma = gamma;


    setDeviceQuaternion(
        alpha,
        beta,
        gamma
    );


    if (
        !orientationReceived
    ) {

        initialQuaternion.copy(
            deviceQuaternion
        );


        orientationReceived = true;

        return;

    }


    relativeQuaternion
        .copy(
            initialQuaternion
        )
        .invert()
        .multiply(
            deviceQuaternion
        );


    updateTargetFromQuaternion(
        relativeQuaternion
    );

}


function onBrowserOrientation(
    event
) {

    if (
        !orientationActive
    ) {

        return;

    }


    if (
        event.alpha === null ||
        event.beta === null ||
        event.gamma === null
    ) {

        return;

    }


    const alpha =
        THREE.MathUtils.degToRad(
            event.alpha
        );


    const beta =
        THREE.MathUtils.degToRad(
            event.beta
        );


    const gamma =
        THREE.MathUtils.degToRad(
            event.gamma
        );


    setDeviceQuaternion(
        alpha,
        beta,
        gamma
    );


    if (
        !orientationReceived
    ) {

        initialQuaternion.copy(
            deviceQuaternion
        );


        orientationReceived = true;

        return;

    }


    relativeQuaternion
        .copy(
            initialQuaternion
        )
        .invert()
        .multiply(
            deviceQuaternion
        );


    updateTargetFromQuaternion(
        relativeQuaternion
    );

}


function setDeviceQuaternion(
    alpha,
    beta,
    gamma
) {

    deviceEuler.set(
        beta,
        alpha,
        -gamma,
        "YXZ"
    );


    deviceQuaternion
        .setFromEuler(
            deviceEuler
        );


    deviceQuaternion.multiply(
        cameraCorrection
    );


    updateScreenAngle();


    screenQuaternion
        .setFromAxisAngle(
            zee,
            -screenAngle
        );


    deviceQuaternion.multiply(
        screenQuaternion
    );

}


function updateTargetFromQuaternion(
    quaternion
) {

    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    forward.applyQuaternion(
        quaternion
    );


    const yaw =
        Math.atan2(
            forward.x,
            -forward.z
        );


    const pitch =
        Math.asin(
            THREE.MathUtils.clamp(
                forward.y,
                -1,
                1
            )
        );


    targetYaw =
        yaw;


    targetPitch =
        THREE.MathUtils.clamp(
            pitch,
            -1.30,
            1.30
        );

}


/* =====================================================
   GYROSCOPE
===================================================== */

function startTelegramGyroscope() {

    if (
        !tg ||
        !tg.Gyroscope ||
        typeof tg.Gyroscope.start !==
            "function"
    ) {

        return;

    }


    tg.onEvent(
        "gyroscopeChanged",
        onTelegramGyroscope
    );


    tg.onEvent(
        "gyroscopeStarted",
        () => {

            gyroscopeActive = true;

        }
    );


    tg.onEvent(
        "gyroscopeFailed",
        error => {

            console.warn(
                "Gyroscope failed:",
                error
            );

            gyroscopeActive = false;

        }
    );


    tg.Gyroscope.start({

        refresh_rate: 20

    });

}


function onTelegramGyroscope() {

    if (
        !gyroscopeActive ||
        !tg.Gyroscope
    ) {

        return;

    }

}


/* =====================================================
   SCREEN ORIENTATION
===================================================== */

function updateScreenAngle() {

    let angle = 0;


    if (
        screen.orientation &&
        typeof screen.orientation.angle ===
            "number"
    ) {

        angle =
            screen.orientation.angle;

    }
    else if (
        typeof window.orientation ===
            "number"
    ) {

        angle =
            window.orientation;

    }


    screenAngle =
        THREE.MathUtils.degToRad(
            angle
        );

}


/* =====================================================
   SENSOR CAMERA
===================================================== */

function updateSensorCamera() {

    if (
        !orientationActive ||
        !orientationReceived ||
        !camera
    ) {

        return;

    }


    sensorYaw +=
        shortestAngleDifference(
            sensorYaw,
            targetYaw
        ) *
        SENSOR_SMOOTH;


    sensorPitch +=
        (
            targetPitch -
            sensorPitch
        ) *
        SENSOR_SMOOTH;


    const horizontalRadius =
        Math.cos(
            sensorPitch
        ) *
        CAMERA_RADIUS;


    const x =
        Math.sin(
            sensorYaw
        ) *
        horizontalRadius;


    const y =
        CAMERA_Y +
        Math.sin(
            sensorPitch
        ) *
        CAMERA_RADIUS;


    const z =
        Math.cos(
            sensorYaw
        ) *
        horizontalRadius;


    camera.position.set(
        x,
        y,
        z
    );


    camera.lookAt(
        MODEL_CENTER
    );

}


function shortestAngleDifference(
    current,
    target
) {

    let difference =
        target -
        current;


    while (
        difference > Math.PI
    ) {

        difference -=
            Math.PI * 2;

    }


    while (
        difference < -Math.PI
    ) {

        difference +=
            Math.PI * 2;

    }


    return difference;

}


/* =====================================================
   STOP SENSORS
===================================================== */

function stopSensors() {

    orientationActive = false;

    orientationReceived = false;

    gyroscopeActive = false;


    if (
        tg &&
        tg.DeviceOrientation &&
        typeof tg.DeviceOrientation.stop ===
            "function"
    ) {

        try {

            tg.DeviceOrientation.stop();

        }
        catch (error) {

            console.warn(
                error
            );

        }

    }


    if (
        tg &&
        tg.Gyroscope &&
        typeof tg.Gyroscope.stop ===
            "function"
    ) {

        try {

            tg.Gyroscope.stop();

        }
        catch (error) {

            console.warn(
                error
            );

        }

    }


    if (
        tg &&
        typeof tg.offEvent ===
            "function"
    ) {

        tg.offEvent(
            "deviceOrientationChanged",
            onTelegramOrientation
        );

        tg.offEvent(
            "deviceOrientationStarted",
            onTelegramOrientationStarted
        );

        tg.offEvent(
            "deviceOrientationFailed",
            onTelegramOrientationFailed
        );

        tg.offEvent(
            "gyroscopeChanged",
            onTelegramGyroscope
        );

    }


    window.removeEventListener(
        "deviceorientation",
        onBrowserOrientation,
        true
    );


    if (controls) {

        controls.enabled = true;

    }


    initialQuaternion.identity();

    relativeQuaternion.identity();

    deviceQuaternion.identity();

    sensorYaw = 0;

    sensorPitch = 0;

    targetYaw = 0;

    targetPitch = 0;

}


/* =====================================================
   RESIZE
===================================================== */

function onResize() {

    if (
        !camera ||
        !renderer
    ) {

        return;

    }


    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


/* =====================================================
   ANIMATION
===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    if (
        controls &&
        controls.enabled
    ) {

        controls.update();

    }


    updateSensorCamera();


    if (
        renderer &&
        scene &&
        camera
    ) {

        renderer.render(
            scene,
            camera
        );

    }

}

</script>
