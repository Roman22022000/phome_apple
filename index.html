<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>3D Gallery</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050505;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        #app {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* =========================
           МЕНЮ
        ========================= */

        #menu {
            position: fixed;

            left: 0;
            top: 0;

            width: 220px;
            height: 100%;

            background: #0b0b0b;

            border-right: 1px solid #222;

            z-index: 100;
        }

        #menuTitle {
            height: 70px;

            display: flex;
            align-items: center;

            padding-left: 22px;

            font-size: 18px;

            border-bottom: 1px solid #222;
        }

        .menuButton {
            width: 100%;

            height: 50px;

            background: transparent;

            border: none;

            border-bottom: 1px solid #1c1c1c;

            color: #aaa;

            text-align: left;

            padding-left: 22px;

            cursor: pointer;

            font-size: 14px;
        }

        .menuButton:hover {
            background: #151515;
            color: #fff;
        }

        .menuButton.active {
            background: #1b1b1b;
            color: #fff;
        }

        /* =========================
           ОСНОВНАЯ ОБЛАСТЬ
        ========================= */

        #content {
            position: absolute;

            left: 220px;
            top: 0;

            right: 0;
            bottom: 0;
        }

        .page {
            width: 100%;
            height: 100%;

            display: none;
        }

        .page.active {
            display: block;
        }

        /* =========================
           ГАЛЕРЕЯ
        ========================= */

        #gallery {
            padding: 35px;

            overflow-y: auto;
        }

        #galleryTitle {
            font-size: 24px;

            margin-bottom: 25px;
        }

        #sceneList {
            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(220px, 1fr));

            gap: 15px;
        }

        .sceneCard {
            min-height: 120px;

            padding: 20px;

            background: #101010;

            border: 1px solid #252525;

            cursor: pointer;

            transition: 0.15s;
        }

        .sceneCard:hover {
            background: #181818;

            border-color: #555;
        }

        .sceneNumber {
            font-size: 11px;

            color: #666;

            margin-bottom: 12px;
        }

        .sceneName {
            font-size: 15px;

            color: #ddd;
        }

        /* =========================
           3D VIEWER
        ========================= */

        #viewer {
            position: relative;

            width: 100%;
            height: 100%;
        }

        #canvas {
            width: 100%;
            height: 100%;

            display: block;
        }

        #viewerPanel {
            position: absolute;

            top: 20px;
            left: 20px;

            padding: 15px;

            background: rgba(0,0,0,0.75);

            border: 1px solid #333;

            z-index: 10;

            min-width: 220px;
        }

        #viewerName {
            font-size: 15px;

            margin-bottom: 12px;
        }

        #backButton {
            width: 100%;

            padding: 9px;

            background: #fff;

            color: #000;

            border: none;

            cursor: pointer;
        }

        #status {
            margin-top: 10px;

            font-size: 11px;

            color: #777;
        }

        /* =========================
           HOME
        ========================= */

        #home {
            display: none;

            align-items: center;
            justify-content: center;

            font-size: 24px;
        }

        #home.active {
            display: flex;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            #menu {
                width: 70px;
            }

            #menuTitle {
                justify-content: center;
                padding: 0;

                font-size: 0;
            }

            #menuTitle::after {
                content: "3D";
                font-size: 16px;
            }

            .menuButton {
                padding: 0;

                text-align: center;

                font-size: 11px;
            }

            #content {
                left: 70px;
            }

            #gallery {
                padding: 20px;
            }

            #sceneList {
                grid-template-columns:
                    repeat(auto-fill, minmax(150px, 1fr));
            }

        }

    </style>
</head>

<body>

<div id="app">

    <!-- =========================
         МЕНЮ
    ========================= -->

    <aside id="menu">

        <div id="menuTitle">
            3D VIEWER
        </div>

        <button
            class="menuButton active"
            data-page="home">
            Главная
        </button>

        <button
            class="menuButton"
            data-page="gallery">
            Галерея
        </button>

    </aside>


    <!-- =========================
         CONTENT
    ========================= -->

    <main id="content">

        <!-- ГЛАВНАЯ -->

        <section
            id="home"
            class="page active">

            3D Scene Viewer

        </section>


        <!-- ГАЛЕРЕЯ -->

        <section
            id="gallery"
            class="page">

            <div id="galleryTitle">
                Галерея 3D сцен
            </div>

            <div id="sceneList">

                <!-- Сюда автоматически добавляются сцены -->

            </div>

        </section>


        <!-- VIEWER -->

        <section
            id="viewer"
            class="page">

            <canvas id="canvas"></canvas>

            <div id="viewerPanel">

                <div id="viewerName">
                    3D Scene
                </div>

                <button id="backButton">
                    ← Назад в галерею
                </button>

                <div id="status">
                    Готово
                </div>

            </div>

        </section>

    </main>

</div>


<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/examples/js/loaders/GLTFLoader.js"></script>


<script>

////////////////////////////////////////////////////////////
// НАСТРОЙКИ
////////////////////////////////////////////////////////////

const SCENES_PATH = "./scenes/";


////////////////////////////////////////////////////////////
// ДОСТУПНЫЕ 3D СЦЕНЫ
////////////////////////////////////////////////////////////
//
// Добавляй сюда новые файлы:
//
// "./scenes/scene4.glb"
// "./scenes/scene5.glb"
//
//

const scenes = [

    {
        name: "Сцена 01",
        file: "scene1.glb"
    },

    {
        name: "Сцена 02",
        file: "scene2.glb"
    },

    {
        name: "Сцена 03",
        file: "scene3.glb"
    }

];


////////////////////////////////////////////////////////////
// ЭЛЕМЕНТЫ
////////////////////////////////////////////////////////////

const pages =
    document.querySelectorAll(".page");


const menuButtons =
    document.querySelectorAll(".menuButton");


const sceneList =
    document.getElementById("sceneList");


const viewerName =
    document.getElementById("viewerName");


const status =
    document.getElementById("status");


const backButton =
    document.getElementById("backButton");


////////////////////////////////////////////////////////////
// ПЕРЕКЛЮЧЕНИЕ РАЗДЕЛОВ
////////////////////////////////////////////////////////////

function showPage(id) {

    pages.forEach(
        page => {

            page.classList.remove("active");

        }
    );


    const target =
        document.getElementById(id);


    if (target) {

        target.classList.add("active");

    }


    menuButtons.forEach(
        button => {

            button.classList.remove("active");

            if (
                button.dataset.page === id
            ) {

                button.classList.add("active");

            }

        }
    );

}


////////////////////////////////////////////////////////////
// МЕНЮ
////////////////////////////////////////////////////////////

menuButtons.forEach(
    button => {

        button.addEventListener(
            "click",
            function() {

                showPage(
                    button.dataset.page
                );

            }
        );

    }
);


////////////////////////////////////////////////////////////
// СОЗДАНИЕ КАРТОЧЕК ГАЛЕРЕИ
////////////////////////////////////////////////////////////

function createGallery() {

    sceneList.innerHTML = "";


    scenes.forEach(
        function(scene, index) {

            const card =
                document.createElement("div");


            card.className =
                "sceneCard";


            card.innerHTML = `

                <div class="sceneNumber">
                    SCENE ${String(index + 1).padStart(2, "0")}
                </div>

                <div class="sceneName">
                    ${scene.name}
                </div>

            `;


            card.addEventListener(
                "click",
                function() {

                    loadScene(scene);

                }
            );


            sceneList.appendChild(
                card
            );

        }
    );

}


createGallery();


////////////////////////////////////////////////////////////
// THREE.JS
////////////////////////////////////////////////////////////

const canvas =
    document.getElementById("canvas");


const renderer =
    new THREE.WebGLRenderer({

        canvas: canvas,

        antialias: true

    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


////////////////////////////////////////////////////////////
// СЦЕНА
////////////////////////////////////////////////////////////

const threeScene =
    new THREE.Scene();


threeScene.background =
    new THREE.Color(0x050505);


////////////////////////////////////////////////////////////
// КАМЕРА
////////////////////////////////////////////////////////////

const camera =
    new THREE.PerspectiveCamera(

        60,

        window.innerWidth /
        window.innerHeight,

        0.01,

        1000

    );


camera.position.set(
    0,
    1.5,
    5
);


////////////////////////////////////////////////////////////
// СВЕТ
////////////////////////////////////////////////////////////

const ambient =
    new THREE.HemisphereLight(

        0xffffff,
        0x222222,
        2

    );


threeScene.add(
    ambient
);


const directional =
    new THREE.DirectionalLight(

        0xffffff,
        3

    );


directional.position.set(
    5,
    10,
    5
);


threeScene.add(
    directional
);


////////////////////////////////////////////////////////////
// 3D WORLD
////////////////////////////////////////////////////////////

const world =
    new THREE.Group();


threeScene.add(
    world
);


////////////////////////////////////////////////////////////
// ЗАГРУЗЧИК
////////////////////////////////////////////////////////////

const loader =
    new THREE.GLTFLoader();


let currentModel = null;


////////////////////////////////////////////////////////////
// ЗАГРУЗКА СЦЕНЫ
////////////////////////////////////////////////////////////

function loadScene(sceneData) {

    showPage("viewer");


    viewerName.innerText =
        sceneData.name;


    status.innerText =
        "Загрузка...";


    ////////////////////////////////////////////////////////
    // УДАЛЯЕМ ПРЕДЫДУЩУЮ
    ////////////////////////////////////////////////////////

    if (currentModel) {

        world.remove(
            currentModel
        );

        currentModel = null;

    }


    ////////////////////////////////////////////////////////
    // ЗАГРУЖАЕМ GLB
    ////////////////////////////////////////////////////////

    loader.load(

        SCENES_PATH +
        sceneData.file,


        function(gltf) {

            currentModel =
                gltf.scene;


            //////////////////////////////////////////////////
            // ЦЕНТРИРОВАНИЕ
            //////////////////////////////////////////////////

            const box =
                new THREE.Box3()
                    .setFromObject(
                        currentModel
                    );


            const center =
                new THREE.Vector3();


            box.getCenter(
                center
            );


            currentModel.position.sub(
                center
            );


            //////////////////////////////////////////////////
            // РАЗМЕР
            //////////////////////////////////////////////////

            const size =
                new THREE.Vector3();


            box.getSize(
                size
            );


            const maxSize =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );


            if (maxSize > 0) {

                currentModel.scale.setScalar(
                    3 / maxSize
                );

            }


            //////////////////////////////////////////////////
            // ОБРАБОТКА МАТЕРИАЛОВ
            //////////////////////////////////////////////////

            currentModel.traverse(
                function(object) {

                    if (
                        object.isMesh
                    ) {

                        object.castShadow =
                            true;

                        object.receiveShadow =
                            true;

                    }

                }
            );


            //////////////////////////////////////////////////
            // ДОБАВЛЯЕМ
            //////////////////////////////////////////////////

            world.add(
                currentModel
            );


            //////////////////////////////////////////////////
            // КАМЕРА
            //////////////////////////////////////////////////

            camera.position.set(
                0,
                1.5,
                5
            );


            camera.lookAt(
                0,
                1,
                0
            );


            status.innerText =
                "Сцена загружена";

        },


        function(xhr) {

            if (xhr.total) {

                const percent =
                    Math.round(
                        xhr.loaded /
                        xhr.total *
                        100
                    );


                status.innerText =
                    "Загрузка: " +
                    percent +
                    "%";

            }

        },


        function(error) {

            console.error(
                error
            );


            status.innerText =
                "Ошибка загрузки сцены";

        }

    );

}


////////////////////////////////////////////////////////////
// НАЗАД
////////////////////////////////////////////////////////////

backButton.addEventListener(
    "click",
    function() {

        showPage(
            "gallery"
        );

    }
);


////////////////////////////////////////////////////////////
// УПРАВЛЕНИЕ МЫШЬЮ
////////////////////////////////////////////////////////////

let mouseDown = false;

let previousX = 0;
let previousY = 0;

let cameraRotationY = 0;
let cameraRotationX = 0;


canvas.addEventListener(
    "mousedown",
    function(event) {

        mouseDown = true;

        previousX =
            event.clientX;

        previousY =
            event.clientY;

    }
);


window.addEventListener(
    "mouseup",
    function() {

        mouseDown = false;

    }
);


window.addEventListener(
    "mousemove",
    function(event) {

        if (!mouseDown) {
            return;
        }


        const dx =
            event.clientX -
            previousX;


        const dy =
            event.clientY -
            previousY;


        cameraRotationY -=
            dx * 0.005;


        cameraRotationX -=
            dy * 0.005;


        cameraRotationX =
            Math.max(
                -1.5,
                Math.min(
                    1.5,
                    cameraRotationX
                )
            );


        previousX =
            event.clientX;


        previousY =
            event.clientY;


        updateCamera();

    }
);


////////////////////////////////////////////////////////////
// КАМЕРА
////////////////////////////////////////////////////////////

function updateCamera() {

    const distance = 5;


    camera.position.x =
        Math.sin(
            cameraRotationY
        ) *
        distance;


    camera.position.z =
        Math.cos(
            cameraRotationY
        ) *
        distance;


    camera.position.y =
        1.5 +
        cameraRotationX *
        2;


    camera.lookAt(
        0,
        1,
        0
    );

}


////////////////////////////////////////////////////////////
// RESIZE
////////////////////////////////////////////////////////////

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


////////////////////////////////////////////////////////////
// RENDER
////////////////////////////////////////////////////////////

function animate() {

    requestAnimationFrame(
        animate
    );


    renderer.render(
        threeScene,
        camera
    );

}


animate();

</script>

</body>
</html>
