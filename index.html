<!DOCTYPE html>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #050505;

    color: white;

    font-family: Arial, sans-serif;
}


/* =====================================================
   ОСНОВНОЙ ЭКРАН
===================================================== */

#home {

    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #050505;
}


/* =====================================================
   ЦЕНТРАЛЬНОЕ МЕНЮ
===================================================== */

#mainMenu {

    width: 300px;

    background: #0c0c0c;

    border: 1px solid #292929;

    border-radius: 8px;

    overflow: hidden;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.5);
}


#menuTitle {

    height: 65px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-bottom: 1px solid #222;

    font-size: 18px;

    letter-spacing: 1px;
}


.menuButton {

    width: 100%;

    height: 55px;

    border: none;

    border-bottom: 1px solid #1e1e1e;

    background: #0c0c0c;

    color: #aaa;

    cursor: pointer;

    font-size: 14px;

    transition: background 0.15s,
                color 0.15s;
}


.menuButton:last-child {

    border-bottom: none;

}


.menuButton:hover {

    background: #181818;

    color: white;

}


/* =====================================================
   ГАЛЕРЕЯ
===================================================== */

#gallery {

    position: fixed;

    inset: 0;

    display: none;

    background: #050505;

    overflow-y: auto;

    padding: 40px;
}


#gallery.active {

    display: block;

}


#galleryHeader {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 30px;
}


#galleryTitle {

    font-size: 24px;

    font-weight: 400;
}


.backButton {

    padding: 10px 18px;

    border: 1px solid #333;

    background: #101010;

    color: #aaa;

    border-radius: 5px;

    cursor: pointer;
}


.backButton:hover {

    color: white;

    background: #181818;

}


/* =====================================================
   КАРТОЧКА СЦЕНЫ
===================================================== */

#sceneList {

    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(220px, 1fr));

    gap: 18px;

    max-width: 1200px;

    margin: 0 auto;
}


.sceneCard {

    min-height: 150px;

    padding: 22px;

    background: #101010;

    border: 1px solid #272727;

    border-radius: 7px;

    cursor: pointer;

    transition:
        background 0.15s,
        border 0.15s,
        transform 0.15s;
}


.sceneCard:hover {

    background: #181818;

    border-color: #555;

    transform: translateY(-2px);

}


.sceneNumber {

    color: #666;

    font-size: 11px;

    margin-bottom: 20px;
}


.sceneName {

    font-size: 17px;

    color: #ddd;
}


/* =====================================================
   ОТДЕЛЬНОЕ ОКНО 3D СЦЕНЫ
===================================================== */

#viewer {

    position: fixed;

    inset: 0;

    display: none;

    background: #050505;

    z-index: 100;
}


#viewer.active {

    display: block;

}


#canvas {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    display: block;
}


/* =====================================================
   ПАНЕЛЬ СЦЕНЫ
===================================================== */

#viewerPanel {

    position: absolute;

    left: 20px;

    top: 20px;

    z-index: 10;

    min-width: 230px;

    padding: 15px;

    background: rgba(0,0,0,0.78);

    border: 1px solid #333;

    border-radius: 7px;

    backdrop-filter: blur(10px);
}


#viewerName {

    font-size: 16px;

    margin-bottom: 12px;
}


#viewerStatus {

    color: #777;

    font-size: 11px;

    margin-top: 10px;
}


#closeViewer {

    width: 100%;

    padding: 9px;

    border: none;

    border-radius: 4px;

    background: white;

    color: black;

    cursor: pointer;
}


#closeViewer:hover {

    background: #ddd;
}


/* =====================================================
   ЗАГРУЗКА
===================================================== */

#loading {

    position: fixed;

    inset: 0;

    z-index: 500;

    display: none;

    align-items: center;

    justify-content: center;

    background: #050505;

    color: white;

    font-size: 14px;
}


#loading.active {

    display: flex;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px) {

    #mainMenu {

        width: calc(100% - 40px);

        max-width: 300px;

    }

    #gallery {

        padding: 20px;

    }

    #galleryHeader {

        align-items: flex-start;

        gap: 15px;

        flex-direction: column;

    }

    #sceneList {

        grid-template-columns: 1fr;

    }

    #viewerPanel {

        left: 10px;

        top: 10px;

        right: 10px;

        min-width: 0;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     ГЛАВНОЕ МЕНЮ
===================================================== -->

<div id="home">

    <div id="mainMenu">

        <div id="menuTitle">
            3D VIEWER
        </div>

        <button
            class="menuButton"
            id="openGallery">

            Галерея

        </button>

    </div>

</div>


<!-- =====================================================
     ГАЛЕРЕЯ
===================================================== -->

<div id="gallery">

    <div id="galleryHeader">

        <div id="galleryTitle">
            Галерея 3D сцен
        </div>

        <button
            class="backButton"
            id="backHome">

            ← Меню

        </button>

    </div>


    <div id="sceneList">

        <!-- CREATURE -->

        <div
            class="sceneCard"
            id="creatureCard">

            <div class="sceneNumber">
                SCENE 01
            </div>

            <div class="sceneName">
                Creature
            </div>

        </div>

    </div>

</div>


<!-- =====================================================
     ОТДЕЛЬНОЕ ОКНО 3D
===================================================== -->

<div id="viewer">

    <canvas id="canvas"></canvas>


    <div id="viewerPanel">

        <div id="viewerName">
            Creature
        </div>

        <button id="closeViewer">

            ← Назад в галерею

        </button>

        <div id="viewerStatus">

            Загрузка...

        </div>

    </div>

</div>


<!-- =====================================================
     LOADING
===================================================== -->

<div id="loading">

    Загрузка 3D сцены...

</div>


<!-- =====================================================
     THREE.JS
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/examples/js/loaders/GLTFLoader.js"></script>


<script>

////////////////////////////////////////////////////////////
// ПУТЬ К CREATURE.GLB
////////////////////////////////////////////////////////////

const CREATURE_URL =
    "https://raw.githubusercontent.com/Roman22022000/phome_apple/main/creature.glb";


////////////////////////////////////////////////////////////
// HTML
////////////////////////////////////////////////////////////

const home =
    document.getElementById("home");

const gallery =
    document.getElementById("gallery");

const viewer =
    document.getElementById("viewer");

const openGallery =
    document.getElementById("openGallery");

const backHome =
    document.getElementById("backHome");

const creatureCard =
    document.getElementById("creatureCard");

const closeViewer =
    document.getElementById("closeViewer");

const viewerStatus =
    document.getElementById("viewerStatus");

const loading =
    document.getElementById("loading");

const canvas =
    document.getElementById("canvas");


////////////////////////////////////////////////////////////
// ОТКРЫТЬ ГАЛЕРЕЮ
////////////////////////////////////////////////////////////

openGallery.addEventListener(
    "click",
    function() {

        home.style.display = "none";

        gallery.classList.add("active");

    }
);


////////////////////////////////////////////////////////////
// НАЗАД В МЕНЮ
////////////////////////////////////////////////////////////

backHome.addEventListener(
    "click",
    function() {

        gallery.classList.remove("active");

        home.style.display = "flex";

    }
);


////////////////////////////////////////////////////////////
// THREE.JS
////////////////////////////////////////////////////////////

const renderer =
    new THREE.WebGLRenderer({

        canvas: canvas,

        antialias: true,

        alpha: false

    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


////////////////////////////////////////////////////////////
// SCENE
////////////////////////////////////////////////////////////

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(0x050505);


////////////////////////////////////////////////////////////
// CAMERA
////////////////////////////////////////////////////////////

const camera =
    new THREE.PerspectiveCamera(

        60,

        window.innerWidth /
        window.innerHeight,

        0.01,

        1000

    );


camera.position.set(
    0,
    1.5,
    5
);


////////////////////////////////////////////////////////////
// LIGHT
////////////////////////////////////////////////////////////

const ambient =
    new THREE.HemisphereLight(

        0xffffff,

        0x222222,

        2.5

    );


scene.add(
    ambient
);


const directional =
    new THREE.DirectionalLight(

        0xffffff,

        3

    );


directional.position.set(
    5,
    10,
    5
);


scene.add(
    directional
);


////////////////////////////////////////////////////////////
// WORLD
////////////////////////////////////////////////////////////

const world =
    new THREE.Group();


scene.add(
    world
);


////////////////////////////////////////////////////////////
// LOADER
////////////////////////////////////////////////////////////

const loader =
    new THREE.GLTFLoader();


let currentModel = null;


////////////////////////////////////////////////////////////
// ОТКРЫТИЕ CREATURE
////////////////////////////////////////////////////////////

creatureCard.addEventListener(
    "click",
    function() {

        openCreature();

    }
);


////////////////////////////////////////////////////////////
// ЗАГРУЗКА CREATURE
////////////////////////////////////////////////////////////

function openCreature() {

    ////////////////////////////////////////////////////////
    // ОТКРЫВАЕМ ОТДЕЛЬНОЕ ОКНО
    ////////////////////////////////////////////////////////

    gallery.classList.remove(
        "active"
    );

    viewer.classList.add(
        "active"
    );


    viewerStatus.innerText =
        "Загрузка creature.glb...";


    ////////////////////////////////////////////////////////
    // УДАЛЯЕМ ПРЕДЫДУЩУЮ МОДЕЛЬ
    ////////////////////////////////////////////////////////

    if (currentModel) {

        world.remove(
            currentModel
        );

        currentModel = null;

    }


    ////////////////////////////////////////////////////////
    // ЗАГРУЗКА
    ////////////////////////////////////////////////////////

    loader.load(

        CREATURE_URL,


        function(gltf) {

            currentModel =
                gltf.scene;


            //////////////////////////////////////////////////
            // РАЗМЕР
            //////////////////////////////////////////////////

            const initialBox =
                new THREE.Box3()
                    .setFromObject(
                        currentModel
                    );


            const initialSize =
                new THREE.Vector3();


            initialBox.getSize(
                initialSize
            );


            const maxSize =
                Math.max(

                    initialSize.x,
                    initialSize.y,
                    initialSize.z

                );


            //////////////////////////////////////////////////
            // МАСШТАБ
            //////////////////////////////////////////////////

            if (maxSize > 0) {

                currentModel.scale.setScalar(
                    3 / maxSize
                );

            }


            //////////////////////////////////////////////////
            // ЦЕНТРИРОВАНИЕ
            //////////////////////////////////////////////////

            const box =
                new THREE.Box3()
                    .setFromObject(
                        currentModel
                    );


            const center =
                new THREE.Vector3();


            box.getCenter(
                center
            );


            currentModel.position.sub(
                center
            );


            //////////////////////////////////////////////////
            // НИЗ МОДЕЛИ = 0
            //////////////////////////////////////////////////

            const finalBox =
                new THREE.Box3()
                    .setFromObject(
                        currentModel
                    );


            currentModel.position.y -=
                finalBox.min.y;


            //////////////////////////////////////////////////
            // МАТЕРИАЛЫ / МЕШИ
            //////////////////////////////////////////////////

            currentModel.traverse(
                function(object) {

                    if (object.isMesh) {

                        object.castShadow =
                            true;

                        object.receiveShadow =
                            true;

                    }

                }
            );


            //////////////////////////////////////////////////
            // ДОБАВЛЯЕМ
            //////////////////////////////////////////////////

            world.add(
                currentModel
            );


            //////////////////////////////////////////////////
            // КАМЕРА
            //////////////////////////////////////////////////

            camera.position.set(
                0,
                1.5,
                5
            );


            camera.lookAt(
                0,
                1,
                0
            );


            //////////////////////////////////////////////////
            // ГОТОВО
            //////////////////////////////////////////////////

            viewerStatus.innerText =
                "Сцена загружена";

        },


        function(xhr) {

            if (xhr.total) {

                const percent =
                    Math.round(

                        xhr.loaded /
                        xhr.total *
                        100

                    );


                viewerStatus.innerText =
                    "Загрузка: " +
                    percent +
                    "%";

            }

        },


        function(error) {

            console.error(
                error
            );


            viewerStatus.innerText =
                "Ошибка загрузки creature.glb";

        }

    );

}


////////////////////////////////////////////////////////////
// ЗАКРЫТЬ VIEWER
////////////////////////////////////////////////////////////

closeViewer.addEventListener(
    "click",
    function() {

        viewer.classList.remove(
            "active"
        );

        gallery.classList.add(
            "active"
        );

    }
);


////////////////////////////////////////////////////////////
// УПРАВЛЕНИЕ МЫШЬЮ
////////////////////////////////////////////////////////////

let mouseDown = false;

let previousX = 0;

let previousY = 0;

let rotationY = 0;

let rotationX = 0;


canvas.addEventListener(
    "mousedown",
    function(event) {

        mouseDown = true;

        previousX =
            event.clientX;

        previousY =
            event.clientY;

    }
);


window.addEventListener(
    "mouseup",
    function() {

        mouseDown = false;

    }
);


window.addEventListener(
    "mousemove",
    function(event) {

        if (!mouseDown) {

            return;

        }


        const dx =
            event.clientX -
            previousX;


        const dy =
            event.clientY -
            previousY;


        rotationY -=
            dx * 0.005;


        rotationX -=
            dy * 0.005;


        rotationX =
            Math.max(
                -1.4,
                Math.min(
                    1.4,
                    rotationX
                )
            );


        previousX =
            event.clientX;


        previousY =
            event.clientY;


        updateCamera();

    }
);


////////////////////////////////////////////////////////////
// КАМЕРА
////////////////////////////////////////////////////////////

function updateCamera() {

    const distance = 5;


    camera.position.x =
        Math.sin(
            rotationY
        ) *
        distance;


    camera.position.z =
        Math.cos(
            rotationY
        ) *
        distance;


    camera.position.y =
        1.5 +
        rotationX * 2;


    camera.lookAt(
        0,
        1,
        0
    );

}


////////////////////////////////////////////////////////////
// TOUCH
////////////////////////////////////////////////////////////

let touchX = 0;

let touchY = 0;


canvas.addEventListener(
    "touchstart",
    function(event) {

        if (
            event.touches.length !== 1
        ) {

            return;

        }


        touchX =
            event.touches[0].clientX;

        touchY =
            event.touches[0].clientY;

    },
    { passive: true }
);


canvas.addEventListener(
    "touchmove",
    function(event) {

        if (
            event.touches.length !== 1
        ) {

            return;

        }


        const x =
            event.touches[0].clientX;


        const y =
            event.touches[0].clientY;


        const dx =
            x - touchX;


        const dy =
            y - touchY;


        rotationY -=
            dx * 0.005;


        rotationX -=
            dy * 0.005;


        rotationX =
            Math.max(
                -1.4,
                Math.min(
                    1.4,
                    rotationX
                )
            );


        touchX = x;

        touchY = y;


        updateCamera();

    },
    { passive: true }
);


////////////////////////////////////////////////////////////
// RESIZE
////////////////////////////////////////////////////////////

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


////////////////////////////////////////////////////////////
// RENDER
////////////////////////////////////////////////////////////

function animate() {

    requestAnimationFrame(
        animate
    );


    renderer.render(
        scene,
        camera
    );

}


animate();

</script>

</body>
</html>
```
