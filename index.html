<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>AR Creature</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =========================
     МЕНЮ
========================= -->

<header class="menu">

    <div class="logo">
        AR CREATURE
    </div>

    <nav>
        <a href="index.html" class="active">
            Сцена
        </a>

        <a href="gallery.html">
            Галерея
        </a>
    </nav>

</header>


<!-- =========================
     3D СЦЕНА
========================= -->

<main id="scene-container"></main>


<!-- =========================
     AR ИНТЕРФЕЙС
========================= -->

<div class="interface">

    <div id="status">
        Загрузка 3D-модели...
    </div>

    <div id="ar-info">
        AR: проверка устройства...
    </div>

</div>


<!-- =========================
     THREE.JS
========================= -->

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>


<script type="module">

import * as THREE from "three";

import { GLTFLoader } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";

import { ARButton } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/ARButton.js";


// =====================================================
// НАСТРОЙКИ
// =====================================================

const MODEL_URL =
"https://raw.githubusercontent.com/Roman22022000/phome_apple/main/creature.glb";


// =====================================================
// ОСНОВНЫЕ ОБЪЕКТЫ
// =====================================================

let scene;
let camera;
let renderer;
let creature;


// =====================================================
// ИНИЦИАЛИЗАЦИЯ
// =====================================================

init();


// =====================================================
// INIT
// =====================================================

function init() {

    const container =
        document.getElementById("scene-container");


    // ---------------------------------------------
    // SCENE
    // ---------------------------------------------

    scene = new THREE.Scene();


    // ---------------------------------------------
    // CAMERA
    // ---------------------------------------------

    camera = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.01,
        100
    );

    camera.position.set(
        0,
        1.5,
        3
    );


    // ---------------------------------------------
    // LIGHT
    // ---------------------------------------------

    const ambient =
        new THREE.HemisphereLight(
            0xffffff,
            0x444444,
            2
        );

    scene.add(ambient);


    const directional =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    directional.position.set(
        2,
        5,
        3
    );

    scene.add(directional);


    // ---------------------------------------------
    // RENDERER
    // ---------------------------------------------

    renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.xr.enabled = true;

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

    container.appendChild(
        renderer.domElement
    );


    // ---------------------------------------------
    // AR BUTTON
    // ---------------------------------------------

    const arButton =
        ARButton.createButton(
            renderer,
            {

                requiredFeatures: [
                    "local-floor"
                ],

                optionalFeatures: [
                    "hit-test",
                    "dom-overlay"
                ],

                domOverlay: {
                    root: document.body
                }

            }
        );


    arButton.style.position = "fixed";
    arButton.style.bottom = "25px";
    arButton.style.left = "50%";
    arButton.style.transform =
        "translateX(-50%)";

    arButton.style.width = "180px";
    arButton.style.height = "50px";

    arButton.style.border = "1px solid white";
    arButton.style.borderRadius = "4px";

    arButton.style.background =
        "rgba(0,0,0,0.75)";

    arButton.style.color = "white";

    arButton.style.fontSize = "14px";

    document.body.appendChild(arButton);


    // ---------------------------------------------
    // ЗАГРУЗКА 3D
    // ---------------------------------------------

    loadCreature();


    // ---------------------------------------------
    // RESIZE
    // ---------------------------------------------

    window.addEventListener(
        "resize",
        onResize
    );


    // ---------------------------------------------
    // XR RENDER LOOP
    // ---------------------------------------------

    renderer.setAnimationLoop(
        render
    );


    // ---------------------------------------------
    // ПРОВЕРКА AR
    // ---------------------------------------------

    checkAR();

}


// =====================================================
// ЗАГРУЗКА CREATURE.GLB
// =====================================================

function loadCreature() {

    const loader =
        new GLTFLoader();


    loader.load(

        MODEL_URL,

        function(gltf) {

            creature =
                gltf.scene;


            // =========================================
            // ЦЕНТР КООРДИНАТ
            // =========================================

            creature.position.set(
                0,
                0,
                0
            );


            creature.rotation.set(
                0,
                0,
                0
            );


            // =========================================
            // АВТОМАСШТАБ
            // =========================================

            const box =
                new THREE.Box3()
                    .setFromObject(creature);


            const size =
                new THREE.Vector3();

            box.getSize(size);


            const maxSize =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );


            // Размер модели примерно 1 метр
            const targetSize = 1.0;


            if (maxSize > 0) {

                const scale =
                    targetSize / maxSize;

                creature.scale.setScalar(
                    scale
                );

            }


            // =========================================
            // ЦЕНТРИРОВАНИЕ
            // =========================================

            const centeredBox =
                new THREE.Box3()
                    .setFromObject(creature);


            const center =
                new THREE.Vector3();

            centeredBox.getCenter(center);


            creature.position.x -=
                center.x;

            creature.position.z -=
                center.z;


            // Чтобы нижняя точка стояла на Y=0

            const finalBox =
                new THREE.Box3()
                    .setFromObject(creature);


            creature.position.y -=
                finalBox.min.y;


            // =========================================
            // ДОБАВЛЯЕМ В СЦЕНУ
            // =========================================

            scene.add(
                creature
            );


            document.getElementById(
                "status"
            ).textContent =
                "3D-модель загружена";


        },

        function(xhr) {

            if (xhr.total) {

                const percent =
                    (xhr.loaded / xhr.total) * 100;

                document.getElementById(
                    "status"
                ).textContent =
                    "Загрузка: " +
                    percent.toFixed(0) +
                    "%";

            }

        },

        function(error) {

            console.error(
                "Ошибка загрузки GLB:",
                error
            );

            document.getElementById(
                "status"
            ).textContent =
                "Ошибка загрузки 3D-модели";

        }

    );

}


// =====================================================
// ПРОВЕРКА WEBXR
// =====================================================

async function checkAR() {

    const info =
        document.getElementById(
            "ar-info"
        );


    if (!navigator.xr) {

        info.textContent =
            "WebXR недоступен";

        return;

    }


    try {

        const supported =
            await navigator.xr.isSessionSupported(
                "immersive-ar"
            );


        if (supported) {

            info.textContent =
                "AR поддерживается";

        } else {

            info.textContent =
                "AR не поддерживается этим устройством";

        }

    } catch (error) {

        console.error(error);

        info.textContent =
            "Ошибка проверки AR";

    }

}


// =====================================================
// RENDER
// =====================================================

function render(
    time,
    frame
) {

    /*
        В обычном режиме:

        camera =
        виртуальная камера пользователя.

        В AR:

        WebXR автоматически обновляет
        положение и ориентацию камеры
        на основании tracking телефона.
    */


    if (
        renderer.xr.isPresenting &&
        frame
    ) {

        updatePhonePose(
            frame
        );

    }


    renderer.render(
        scene,
        camera
    );

}


// =====================================================
// ПОЛУЧЕНИЕ ПОЗЫ ТЕЛЕФОНА
// =====================================================

function updatePhonePose(frame) {

    const session =
        renderer.xr.getSession();


    const referenceSpace =
        renderer.xr.getReferenceSpace();


    if (
        !session ||
        !referenceSpace
    ) {
        return;
    }


    /*
        viewer space показывает,
        где находится пользовательская
        камера относительно AR-пространства.
    */

    const viewerSpace =
        referenceSpace;


    /*
        Получаем viewer pose.

        Здесь находятся:

        position:
        X
        Y
        Z

        orientation:
        quaternion X
        quaternion Y
        quaternion Z
        quaternion W
    */

    const pose =
        frame.getViewerPose(
            viewerSpace
        );


    if (!pose) {
        return;
    }


    const transform =
        pose.transform;


    // ---------------------------------------------
    // ПОЛОЖЕНИЕ ТЕЛЕФОНА
    // ---------------------------------------------

    const x =
        transform.position.x;

    const y =
        transform.position.y;

    const z =
        transform.position.z;


    // ---------------------------------------------
    // ОРИЕНТАЦИЯ
    // ---------------------------------------------

    const q =
        transform.orientation;


    /*
        q.x
        q.y
        q.z
        q.w

        представляют ориентацию
        телефона в пространстве.
    */


    // Можно использовать эти данные
    // для дополнительной логики сайта.

    // Например:

    // console.log({
    //     position: {x, y, z},
    //     orientation: {
    //         x: q.x,
    //         y: q.y,
    //         z: q.z,
    //         w: q.w
    //     }
    // });

}


// =====================================================
// RESIZE
// =====================================================

function onResize() {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}

</script>

</body>
</html>
