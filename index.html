<script type="module">

import * as THREE
from "three";


import {
    GLTFLoader
}
from "three/addons/loaders/GLTFLoader.js";


// =====================================================
// MODEL URL
// =====================================================

const MODEL_URL =
"https://raw.githubusercontent.com/Roman22022000/phome_apple/main/creature.glb";


// =====================================================
// THREE VARIABLES
// =====================================================

let scene;

let camera;

let renderer;

let creature = null;


// =====================================================
// AR VARIABLES
// =====================================================

let xrSession = null;

let xrReferenceSpace = null;

let modelPlaced = false;


// =====================================================
// TOUCH CONTROL VARIABLES
// =====================================================

let touchMode = "none";

let oneFingerStartX = 0;

let oneFingerStartY = 0;

let oneFingerLastX = 0;

let oneFingerLastY = 0;


let twoFingerStartDistance = 0;

let twoFingerStartScale = 1;


let twoFingerStartCenterX = 0;

let twoFingerStartCenterY = 0;


let twoFingerStartPositionX = 0;

let twoFingerStartPositionY = 0;


// =====================================================
// SCENE CONTROL
// =====================================================

let sceneRotationY = 0;

let sceneRotationX = 0;

let sceneScale = 1;

let sceneOffsetX = 0;

let sceneOffsetY = 0;


// =====================================================
// DOM
// =====================================================

const status =
document.getElementById(
    "status"
);


const arButton =
document.getElementById(
    "arButton"
);


// =====================================================
// INIT
// =====================================================

init();


// =====================================================
// INITIALIZATION
// =====================================================

function init() {


    // =================================================
    // SCENE
    // =================================================

    scene =
        new THREE.Scene();


    // =================================================
    // CAMERA
    // =================================================

    camera =
        new THREE.PerspectiveCamera(

            60,

            window.innerWidth /
            window.innerHeight,

            0.01,

            100

        );


    camera.position.set(

        0,

        1.5,

        3

    );


    // =================================================
    // LIGHT
    // =================================================

    const hemisphere =
        new THREE.HemisphereLight(

            0xffffff,

            0x444444,

            2

        );


    scene.add(
        hemisphere
    );


    const directional =
        new THREE.DirectionalLight(

            0xffffff,

            3

        );


    directional.position.set(

        2,

        5,

        3

    );


    scene.add(
        directional
    );


    // =================================================
    // RENDERER
    // =================================================

    renderer =
        new THREE.WebGLRenderer({

            antialias: true,

            alpha: true

        });


    renderer.setPixelRatio(

        Math.min(

            window.devicePixelRatio,

            2

        )

    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    renderer.xr.enabled =
        true;


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    document.body.appendChild(
        renderer.domElement
    );


    // =================================================
    // TOUCH
    // =================================================

    setupTouchControls();


    // =================================================
    // MODEL
    // =================================================

    loadModel();


    // =================================================
    // AR
    // =================================================

    checkAR();


    // =================================================
    // BUTTON
    // =================================================

    arButton.addEventListener(

        "click",

        startAR

    );


    // =================================================
    // GALLERY
    // =================================================

    setupGallery();


    // =================================================
    // RESIZE
    // =================================================

    window.addEventListener(

        "resize",

        resize

    );


    // =================================================
    // RENDER
    // =================================================

    renderer.setAnimationLoop(

        render

    );

}


// =====================================================
// LOAD MODEL
// =====================================================

function loadModel() {


    status.textContent =
        "Загрузка creature.glb...";


    const loader =
        new GLTFLoader();


    loader.load(

        MODEL_URL,


        function(gltf) {


            creature =
                gltf.scene;


            // =========================================
            // SCALE MODEL
            // =========================================

            const box =
                new THREE.Box3()
                    .setFromObject(
                        creature
                    );


            const size =
                new THREE.Vector3();


            box.getSize(
                size
            );


            const maxSize =
                Math.max(

                    size.x,

                    size.y,

                    size.z

                );


            if (maxSize > 0) {

                creature.scale.setScalar(

                    1 /
                    maxSize

                );

            }


            // =========================================
            // CENTER
            // =========================================

            centerModel();


            // =========================================
            // ADD
            // =========================================

            scene.add(
                creature
            );


            status.textContent =
                "CREATURE загружен";


        },


        function(xhr) {


            if (xhr.total > 0) {


                const percent =
                    xhr.loaded /
                    xhr.total *
                    100;


                status.textContent =

                    "Загрузка " +

                    percent.toFixed(0) +

                    "%";

            }

        },


        function(error) {


            console.error(
                "GLB ERROR:",
                error
            );


            status.textContent =
                "Ошибка creature.glb";

        }

    );

}


// =====================================================
// CENTER MODEL
// =====================================================

function centerModel() {


    if (!creature)
        return;


    const box =
        new THREE.Box3()
            .setFromObject(
                creature
            );


    const center =
        new THREE.Vector3();


    box.getCenter(
        center
    );


    creature.position.x -=
        center.x;


    creature.position.z -=
        center.z;


    const box2 =
        new THREE.Box3()
            .setFromObject(
                creature
            );


    creature.position.y -=
        box2.min.y;

}


// =====================================================
// TOUCH CONTROLS
// =====================================================

function setupTouchControls() {


    const canvas =
        renderer.domElement;


    canvas.addEventListener(

        "touchstart",

        function(event) {


            if (
                renderer.xr.isPresenting
            ) {

                return;

            }


            event.preventDefault();


            // =========================================
            // ONE FINGER
            // =========================================

            if (
                event.touches.length === 1
            ) {


                touchMode =
                    "one";


                const touch =
                    event.touches[0];


                oneFingerStartX =
                    touch.clientX;


                oneFingerStartY =
                    touch.clientY;


                oneFingerLastX =
                    touch.clientX;


                oneFingerLastY =
                    touch.clientY;

            }


            // =========================================
            // TWO FINGERS
            // =========================================

            if (
                event.touches.length >= 2
            ) {


                touchMode =
                    "two";


                const t1 =
                    event.touches[0];


                const t2 =
                    event.touches[1];


                twoFingerStartDistance =
                    getTouchDistance(
                        t1,
                        t2
                    );


                twoFingerStartScale =
                    sceneScale;


                const center =
                    getTouchCenter(
                        t1,
                        t2
                    );


                twoFingerStartCenterX =
                    center.x;


                twoFingerStartCenterY =
                    center.y;


                twoFingerStartPositionX =
                    sceneOffsetX;


                twoFingerStartPositionY =
                    sceneOffsetY;

            }

        },

        {
            passive: false
        }

    );


    // =================================================
    // TOUCH MOVE
    // =================================================

    canvas.addEventListener(

        "touchmove",

        function(event) {


            if (
                renderer.xr.isPresenting
            ) {

                return;

            }


            event.preventDefault();


            // =========================================
            // ONE FINGER = ROTATION
            // =========================================

            if (

                event.touches.length === 1 &&

                touchMode === "one"

            ) {


                const touch =
                    event.touches[0];


                const dx =
                    touch.clientX -
                    oneFingerLastX;


                const dy =
                    touch.clientY -
                    oneFingerLastY;


                oneFingerLastX =
                    touch.clientX;


                oneFingerLastY =
                    touch.clientY;


                // Горизонтальное вращение

                sceneRotationY +=
                    dx * 0.01;


                // Вертикальное вращение

                sceneRotationX +=
                    dy * 0.01;


                // Ограничиваем наклон

                sceneRotationX =
                    THREE.MathUtils.clamp(

                        sceneRotationX,

                        -1.3,

                        1.3

                    );


                applySceneControls();

            }


            // =========================================
            // TWO FINGERS
            // =========================================

            if (

                event.touches.length >= 2 &&

                touchMode === "two"

            ) {


                const t1 =
                    event.touches[0];


                const t2 =
                    event.touches[1];


                // -------------------------------------
                // PINCH
                // -------------------------------------

                const distance =
                    getTouchDistance(
                        t1,
                        t2
                    );


                if (
                    twoFingerStartDistance > 0
                ) {


                    const factor =
                        distance /
                        twoFingerStartDistance;


                    sceneScale =
                        twoFingerStartScale *
                        factor;


                    sceneScale =
                        THREE.MathUtils.clamp(

                            sceneScale,

                            0.25,

                            4

                        );

                }


                // -------------------------------------
                // TWO-FINGER MOVE
                // -------------------------------------

                const center =
                    getTouchCenter(
                        t1,
                        t2
                    );


                const dx =
                    center.x -
                    twoFingerStartCenterX;


                const dy =
                    center.y -
                    twoFingerStartCenterY;


                sceneOffsetX =
                    twoFingerStartPositionX +
                    dx * 0.003;


                sceneOffsetY =
                    twoFingerStartPositionY -
                    dy * 0.003;


                applySceneControls();

            }

        },

        {
            passive: false
        }

    );


    // =================================================
    // TOUCH END
    // =================================================

    canvas.addEventListener(

        "touchend",

        function(event) {


            if (
                event.touches.length === 0
            ) {

                touchMode =
                    "none";

            }


            if (
                event.touches.length === 1
            ) {

                touchMode =
                    "one";


                const touch =
                    event.touches[0];


                oneFingerLastX =
                    touch.clientX;


                oneFingerLastY =
                    touch.clientY;

            }

        },

        {
            passive: false
        }

    );

}


// =====================================================
// TOUCH DISTANCE
// =====================================================

function getTouchDistance(
    a,
    b
) {


    const dx =
        b.clientX -
        a.clientX;


    const dy =
        b.clientY -
        a.clientY;


    return Math.sqrt(

        dx * dx +
        dy * dy

    );

}


// =====================================================
// TOUCH CENTER
// =====================================================

function getTouchCenter(
    a,
    b
) {


    return {

        x:
            (a.clientX +
             b.clientX) / 2,

        y:
            (a.clientY +
             b.clientY) / 2

    };

}


// =====================================================
// APPLY SCENE CONTROLS
// =====================================================

function applySceneControls() {


    if (!creature)
        return;


    /*
        Эти параметры используются
        только в обычном 3D-просмотре.

        В настоящем AR камера управляется
        WebXR, а модель фиксируется
        в AR-пространстве.
    */


    creature.rotation.y =
        sceneRotationY;


    creature.rotation.x =
        sceneRotationX;


    creature.scale.setScalar(
        sceneScale
    );


    creature.position.x =
        sceneOffsetX;


    creature.position.y =
        sceneOffsetY;

}


// =====================================================
// CHECK AR
// =====================================================

async function checkAR() {


    if (!navigator.xr) {


        status.textContent =
            "WebXR отсутствует";


        arButton.textContent =
            "AR НЕДОСТУПЕН";


        return;

    }


    try {


        const supported =
            await navigator.xr
                .isSessionSupported(
                    "immersive-ar"
                );


        if (supported) {


            status.textContent =
                "AR готов";


            arButton.disabled =
                false;


            arButton.textContent =
                "ЗАПУСТИТЬ AR";

        }

        else {


            status.textContent =
                "AR не поддерживается";


            arButton.textContent =
                "AR НЕДОСТУПЕН";

        }


    }

    catch(error) {


        console.error(error);


        status.textContent =
            "Ошибка проверки AR";

    }

}


// =====================================================
// START AR
// =====================================================

async function startAR() {


    if (xrSession) {


        await xrSession.end();


        return;

    }


    try {


        // =============================================
        // AR SESSION
        // =============================================

        xrSession =
            await navigator.xr.requestSession(

                "immersive-ar",

                {

                    requiredFeatures: [

                        "local-floor"

                    ],

                    optionalFeatures: [

                        "hit-test",

                        "dom-overlay"

                    ],

                    domOverlay: {

                        root:
                            document.body

                    }

                }

            );


        // =============================================
        // END
        // =============================================

        xrSession.addEventListener(

            "end",

            function() {


                xrSession = null;

                xrReferenceSpace = null;

                modelPlaced = false;


                arButton.style.display =
                    "block";


                arButton.textContent =
                    "ЗАПУСТИТЬ AR";


                status.textContent =
                    "AR завершён";

            }

        );


        // =============================================
        // CONNECT THREE
        // =============================================

        await renderer.xr.setSession(
            xrSession
        );


        // =============================================
        // REFERENCE SPACE
        // =============================================

        try {


            xrReferenceSpace =
                await xrSession
                    .requestReferenceSpace(

                        "local-floor"

                    );

        }

        catch(error) {


            xrReferenceSpace =
                await xrSession
                    .requestReferenceSpace(

                        "local"

                    );

        }


        arButton.style.display =
            "none";


        status.textContent =
            "AR активен";


    }

    catch(error) {


        console.error(
            "AR ERROR:",
            error
        );


        status.textContent =
            "Ошибка AR: " +
            error.message;

    }

}


// =====================================================
// RENDER
// =====================================================

function render(
    time,
    frame
) {


    // ================================================
    // AR PHONE TRACKING
    // ================================================

    if (

        frame &&

        xrSession &&

        xrReferenceSpace

    ) {


        processPhoneData(
            frame
        );

    }


    // ================================================
    // RENDER
    // ================================================

    renderer.render(

        scene,

        camera

    );

}


// =====================================================
// PHONE POSITION + ROTATION
// =====================================================

function processPhoneData(
    frame
) {


    const pose =
        frame.getViewerPose(

            xrReferenceSpace

        );


    if (!pose)
        return;


    // ================================================
    // POSITION
    // ================================================

    const position =
        pose.transform.position;


    document.getElementById(
        "x"
    ).textContent =
        position.x.toFixed(3);


    document.getElementById(
        "y"
    ).textContent =
        position.y.toFixed(3);


    document.getElementById(
        "z"
    ).textContent =
        position.z.toFixed(3);


    // ================================================
    // ORIENTATION
    // ================================================

    const orientation =
        pose.transform.orientation;


    const quaternion =
        new THREE.Quaternion(

            orientation.x,

            orientation.y,

            orientation.z,

            orientation.w

        );


    const euler =
        new THREE.Euler();


    euler.setFromQuaternion(

        quaternion,

        "YXZ"

    );


    document.getElementById(
        "rx"
    ).textContent =
        euler.x.toFixed(3);


    document.getElementById(
        "ry"
    ).textContent =
        euler.y.toFixed(3);


    document.getElementById(
        "rz"
    ).textContent =
        euler.z.toFixed(3);


    // ================================================
    // FIRST PLACEMENT
    // ================================================

    if (

        !modelPlaced &&

        creature

    ) {


        placeCreature(
            pose
        );

    }

}


// =====================================================
// PLACE CREATURE IN AR
// =====================================================

function placeCreature(
    pose
) {


    if (!creature)
        return;


    const position =
        pose.transform.position;


    const orientation =
        pose.transform.orientation;


    const quaternion =
        new THREE.Quaternion(

            orientation.x,

            orientation.y,

            orientation.z,

            orientation.w

        );


    // ================================================
    // FORWARD
    // ================================================

    const forward =
        new THREE.Vector3(

            0,

            0,

            -1

        );


    forward.applyQuaternion(
        quaternion
    );


    // ================================================
    // DISTANCE
    // ================================================

    const distance =
        1.5;


    // ================================================
    // POSITION
    // ================================================

    creature.position.set(

        position.x +
        forward.x *
        distance,

        0,

        position.z +
        forward.z *
        distance

    );


    // ================================================
    // RESET TOUCH TRANSFORM
    // ================================================

    creature.rotation.set(

        0,

        0,

        0

    );


    creature.scale.setScalar(
        1
    );


    sceneRotationX = 0;

    sceneRotationY = 0;

    sceneScale = 1;

    sceneOffsetX = 0;

    sceneOffsetY = 0;


    // ================================================
    // FIX
    // ================================================

    modelPlaced =
        true;


    status.textContent =
        "CREATURE зафиксирован в пространстве";

}

function setupGallery() {


    const gallery =
        document.getElementById(
            "gallery"
        );


    const sceneButton =
        document.getElementById(
            "sceneButton"
        );


    const galleryButton =
        document.getElementById(
            "galleryButton"
        );


    const openCreature =
        document.getElementById(
            "openCreature"
        );


    // ================================================
    // GALLERY OPEN
    // ================================================

    galleryButton.addEventListener(

        "click",

        function() {


            gallery.style.display =
                "block";


            galleryButton.classList.add(
                "active"
            );


            sceneButton.classList.remove(
                "active"
            );

        }

    );


    // ================================================
    // SCENE
    // ================================================

    sceneButton.addEventListener(

        "click",

        function() {


            gallery.style.display =
                "none";


            sceneButton.classList.add(
                "active"
            );


            galleryButton.classList.remove(
                "active"
            );

        }

    );


    // ================================================
    // OPEN AR
    // ================================================

    openCreature.addEventListener(

        "click",

        function() {


            gallery.style.display =
                "none";


            sceneButton.classList.add(
                "active"
            );


            galleryButton.classList.remove(
                "active"
            );


            if (
                !xrSession &&
                !arButton.disabled
            ) {


                startAR();

            }

        }

    );

}

function resize() {


    camera.aspect =

        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );

}
