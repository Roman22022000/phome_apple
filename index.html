<script type="module">

import * as THREE from "three";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";


// ==================================================
// MODEL
// ==================================================

const MODEL_URL =
"https://raw.githubusercontent.com/Roman22022000/phome_apple/main/creature.glb";


// ==================================================
// THREE VARIABLES
// ==================================================

let scene;
let camera;
let renderer;

let creature = null;

let xrSession = null;
let xrReferenceSpace = null;

let modelPlaced = false;


// ==================================================
// DOM
// ==================================================

const status =
document.getElementById("status");

const arButton =
document.getElementById("arButton");


// ==================================================
// INIT
// ==================================================

init();


// ==================================================
// THREE INITIALIZATION
// ==================================================

function init() {

    // ----------------------------------------------
    // SCENE
    // ----------------------------------------------

    scene =
        new THREE.Scene();


    // ----------------------------------------------
    // CAMERA
    // ----------------------------------------------

    camera =
        new THREE.PerspectiveCamera(
            70,
            window.innerWidth /
            window.innerHeight,
            0.01,
            100
        );


    camera.position.set(
        0,
        1.6,
        3
    );


    // ----------------------------------------------
    // LIGHT
    // ----------------------------------------------

    const hemisphere =
        new THREE.HemisphereLight(
            0xffffff,
            0x444444,
            2
        );

    scene.add(
        hemisphere
    );


    const directional =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    directional.position.set(
        2,
        5,
        3
    );

    scene.add(
        directional
    );


    // ----------------------------------------------
    // RENDERER
    // ----------------------------------------------

    renderer =
        new THREE.WebGLRenderer({
            antialias: true,
            alpha: true
        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.xr.enabled = true;


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    document.body.appendChild(
        renderer.domElement
    );


    // ----------------------------------------------
    // LOAD MODEL
    // ----------------------------------------------

    loadModel();


    // ----------------------------------------------
    // AR
    // ----------------------------------------------

    checkAR();


    // ----------------------------------------------
    // BUTTON
    // ----------------------------------------------

    arButton.addEventListener(
        "click",
        startAR
    );


    // ----------------------------------------------
    // GALLERY
    // ----------------------------------------------

    setupGallery();


    // ----------------------------------------------
    // RESIZE
    // ----------------------------------------------

    window.addEventListener(
        "resize",
        resize
    );


    // ----------------------------------------------
    // RENDER LOOP
    // ----------------------------------------------

    renderer.setAnimationLoop(
        render
    );

}


// ==================================================
// LOAD GLB
// ==================================================

function loadModel() {

    status.textContent =
        "Загрузка creature.glb...";


    const loader =
        new GLTFLoader();


    loader.load(

        MODEL_URL,


        // SUCCESS
        function(gltf) {

            creature =
                gltf.scene;


            // --------------------------------------
            // SCALE
            // --------------------------------------

            const box =
                new THREE.Box3()
                    .setFromObject(
                        creature
                    );


            const size =
                new THREE.Vector3();


            box.getSize(
                size
            );


            const maxSize =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );


            if (maxSize > 0) {

                creature.scale.setScalar(
                    1 / maxSize
                );

            }


            // --------------------------------------
            // CENTER
            // --------------------------------------

            centerModel();


            // --------------------------------------
            // ADD SCENE
            // --------------------------------------

            scene.add(
                creature
            );


            status.textContent =
                "CREATURE загружен";


        },


        // PROGRESS
        function(xhr) {

            if (xhr.total > 0) {

                const percent =
                    xhr.loaded /
                    xhr.total *
                    100;


                status.textContent =
                    "Загрузка " +
                    percent.toFixed(0) +
                    "%";

            }

        },


        // ERROR
        function(error) {

            console.error(
                "GLB ERROR:",
                error
            );


            status.textContent =
                "Ошибка загрузки creature.glb";

        }

    );

}


// ==================================================
// CENTER MODEL
// ==================================================

function centerModel() {

    if (!creature)
        return;


    const box =
        new THREE.Box3()
            .setFromObject(
                creature
            );


    const center =
        new THREE.Vector3();


    box.getCenter(
        center
    );


    creature.position.x -=
        center.x;


    creature.position.z -=
        center.z;


    const box2 =
        new THREE.Box3()
            .setFromObject(
                creature
            );


    creature.position.y -=
        box2.min.y;

}


// ==================================================
// CHECK AR
// ==================================================

async function checkAR() {

    if (!navigator.xr) {

        status.textContent =
            "WebXR отсутствует";

        arButton.textContent =
            "AR НЕДОСТУПЕН";

        return;

    }


    try {

        const supported =
            await navigator.xr
                .isSessionSupported(
                    "immersive-ar"
                );


        if (supported) {

            status.textContent =
                "AR готов";

            arButton.disabled =
                false;

            arButton.textContent =
                "ЗАПУСТИТЬ AR";

        }
        else {

            status.textContent =
                "Immersive AR не поддерживается";

            arButton.textContent =
                "AR НЕДОСТУПЕН";

        }

    }
    catch(error) {

        console.error(error);

        status.textContent =
            "Ошибка WebXR";

    }

}


// ==================================================
// START AR
// ==================================================

async function startAR() {

    if (xrSession) {

        await xrSession.end();

        return;

    }


    try {

        // ==========================================
        // REQUEST AR SESSION
        // ==========================================

        xrSession =
            await navigator.xr.requestSession(
                "immersive-ar",
                {

                    requiredFeatures: [
                        "local-floor"
                    ],

                    optionalFeatures: [
                        "hit-test",
                        "dom-overlay"
                    ],

                    domOverlay: {
                        root: document.body
                    }

                }
            );


        // ==========================================
        // END
        // ==========================================

        xrSession.addEventListener(
            "end",
            function() {

                xrSession = null;

                xrReferenceSpace = null;

                modelPlaced = false;


                arButton.style.display =
                    "block";


                arButton.textContent =
                    "ЗАПУСТИТЬ AR";


                status.textContent =
                    "AR завершён";

            }
        );


        // ==========================================
        // THREE XR
        // ==========================================

        await renderer.xr.setSession(
            xrSession
        );


        // ==========================================
        // REFERENCE SPACE
        // ==========================================

        try {

            xrReferenceSpace =
                await xrSession
                    .requestReferenceSpace(
                        "local-floor"
                    );

        }
        catch(error) {

            xrReferenceSpace =
                await xrSession
                    .requestReferenceSpace(
                        "local"
                    );

        }


        arButton.style.display =
            "none";


        status.textContent =
            "AR работает";


    }
    catch(error) {

        console.error(
            "AR SESSION ERROR:",
            error
        );


        status.textContent =
            "Ошибка запуска AR: " +
            error.message;

    }

}


// ==================================================
// RENDER
// ==================================================

function render(
    time,
    frame
) {

    if (
        frame &&
        xrSession &&
        xrReferenceSpace
    ) {

        processPhone(
            frame
        );

    }


    renderer.render(
        scene,
        camera
    );

}


// ==================================================
// ПОЛУЧЕНИЕ ДАННЫХ ТЕЛЕФОНА
// ==================================================

function processPhone(frame) {

    /*
        XRViewerPose содержит:

        POSITION:

        X
        Y
        Z

        ORIENTATION:

        quaternion X
        quaternion Y
        quaternion Z
        quaternion W
    */


    const pose =
        frame.getViewerPose(
            xrReferenceSpace
        );


    if (!pose)
        return;


    const position =
        pose.transform.position;


    const orientation =
        pose.transform.orientation;


    // ==========================================
    // POSITION
    // ==========================================

    document.getElementById("x")
        .textContent =
        position.x.toFixed(3);


    document.getElementById("y")
        .textContent =
        position.y.toFixed(3);


    document.getElementById("z")
        .textContent =
        position.z.toFixed(3);


    // ==========================================
    // QUATERNION
    // ==========================================

    const quaternion =
        new THREE.Quaternion(

            orientation.x,

            orientation.y,

            orientation.z,

            orientation.w

        );


    // ==========================================
    // EULER
    // ==========================================

    const euler =
        new THREE.Euler()
            .setFromQuaternion(
                quaternion,
                "YXZ"
            );


    document.getElementById("rx")
        .textContent =
        euler.x.toFixed(3);


    document.getElementById("ry")
        .textContent =
        euler.y.toFixed(3);


    document.getElementById("rz")
        .textContent =
        euler.z.toFixed(3);


    // ==========================================
    // PLACE MODEL
    // ==========================================

    if (
        !modelPlaced &&
        creature
    ) {

        placeCreature(
            pose
        );

    }

}


// ==================================================
// PLACE CREATURE
// ==================================================

function placeCreature(pose) {

    if (!creature)
        return;


    const position =
        pose.transform.position;


    const orientation =
        pose.transform.orientation;


    const quaternion =
        new THREE.Quaternion(

            orientation.x,
            orientation.y,
            orientation.z,
            orientation.w

        );


    // ==========================================
    // НАПРАВЛЕНИЕ ВЗГЛЯДА
    // ==========================================

    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    forward.applyQuaternion(
        quaternion
    );


    // ==========================================
    // 1.5 МЕТРА ПЕРЕД ПОЛЬЗОВАТЕЛЕМ
    // ==========================================

    const distance = 1.5;


    creature.position.set(

        position.x +
        forward.x *
        distance,

        0,

        position.z +
        forward.z *
        distance

    );


    // ==========================================
    // МОДЕЛЬ НЕ ВРАЩАЕТСЯ ВМЕСТЕ
    // С ТЕЛЕФОНОМ
    // ==========================================

    creature.rotation.set(
        0,
        0,
        0
    );


    modelPlaced = true;


    status.textContent =
        "CREATURE зафиксирован";


}


// ==================================================
// GALLERY
// ==================================================

function setupGallery() {

    const gallery =
        document.getElementById(
            "gallery"
        );


    const galleryButton =
        document.getElementById(
            "galleryButton"
        );


    const sceneButton =
        document.getElementById(
            "sceneButton"
        );


    const openCreature =
        document.getElementById(
            "openCreature"
        );


    galleryButton.addEventListener(
        "click",
        function() {

            gallery.style.display =
                "block";

            galleryButton.classList.add(
                "active"
            );

            sceneButton.classList.remove(
                "active"
            );

        }
    );


    sceneButton.addEventListener(
        "click",
        function() {

            gallery.style.display =
                "none";

            sceneButton.classList.add(
                "active"
            );

            galleryButton.classList.remove(
                "active"
            );

        }
    );


    openCreature.addEventListener(
        "click",
        function() {

            gallery.style.display =
                "none";

            sceneButton.classList.add(
                "active"
            );

            galleryButton.classList.remove(
                "active"
            );


            if (xrSession) {

                return;

            }


            if (
                !arButton.disabled
            ) {

                startAR();

            }

        }
    );

}


// ==================================================
// RESIZE
// ==================================================

function resize() {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}

</script>

</body>
</html>
