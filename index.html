<!-- =====================================================
     THREE.JS
===================================================== -->

<script type="importmap">

{
    "imports": {

        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

    }
}

</script>


<script type="module">

import * as THREE
    from "three";

import {
    GLTFLoader
} from
    "three/addons/loaders/GLTFLoader.js";


////////////////////////////////////////////////////////////
// НАСТРОЙКИ
////////////////////////////////////////////////////////////

const MODEL_URL =
    "https://raw.githubusercontent.com/Roman22022000/phome_apple/main/creature.glb";


////////////////////////////////////////////////////////////
// HTML
////////////////////////////////////////////////////////////

const canvas =
    document.getElementById("canvas");

const menu =
    document.getElementById("menu");

const loading =
    document.getElementById("loading");

const status =
    document.getElementById("status");

const startAR =
    document.getElementById("startAR");

const start3D =
    document.getElementById("start3D");

const arPanel =
    document.getElementById("arPanel");

const exitAR =
    document.getElementById("exitAR");

const positionElement =
    document.getElementById("position");


////////////////////////////////////////////////////////////
// RENDERER
////////////////////////////////////////////////////////////

const renderer =
    new THREE.WebGLRenderer({

        canvas: canvas,

        antialias: true,

        alpha: true

    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


////////////////////////////////////////////////////////////
// WEBXR
////////////////////////////////////////////////////////////

renderer.xr.enabled = true;


////////////////////////////////////////////////////////////
// SCENE
////////////////////////////////////////////////////////////

const scene =
    new THREE.Scene();


////////////////////////////////////////////////////////////
// CAMERA
////////////////////////////////////////////////////////////

const camera =
    new THREE.PerspectiveCamera(

        60,

        window.innerWidth /
        window.innerHeight,

        0.01,

        1000

    );


////////////////////////////////////////////////////////////
// LIGHT
////////////////////////////////////////////////////////////

const ambientLight =
    new THREE.HemisphereLight(

        0xffffff,

        0x222222,

        2.5

    );


scene.add(
    ambientLight
);


const directionalLight =
    new THREE.DirectionalLight(

        0xffffff,

        3

    );


directionalLight.position.set(
    5,
    10,
    5
);


scene.add(
    directionalLight
);


////////////////////////////////////////////////////////////
// WORLD
////////////////////////////////////////////////////////////

const world =
    new THREE.Group();


scene.add(
    world
);


////////////////////////////////////////////////////////////
// MODEL
////////////////////////////////////////////////////////////

let model = null;


////////////////////////////////////////////////////////////
// LOADER
////////////////////////////////////////////////////////////

const loader =
    new GLTFLoader();


////////////////////////////////////////////////////////////
// ЗАГРУЗКА CREATURE.GLB
////////////////////////////////////////////////////////////

loader.load(

    MODEL_URL,


    function(gltf) {

        model =
            gltf.scene;


        ////////////////////////////////////////////////////
        // ПОЛУЧАЕМ РАЗМЕР
        ////////////////////////////////////////////////////

        const box =
            new THREE.Box3()
                .setFromObject(model);


        const size =
            new THREE.Vector3();


        box.getSize(size);


        const maxSize =
            Math.max(

                size.x,
                size.y,
                size.z

            );


        ////////////////////////////////////////////////////
        // МАСШТАБ
        ////////////////////////////////////////////////////

        if (maxSize > 0) {

            const targetSize = 2;

            model.scale.setScalar(

                targetSize /
                maxSize

            );

        }


        ////////////////////////////////////////////////////
        // ЦЕНТРИРОВАНИЕ ПО X/Z
        ////////////////////////////////////////////////////

        const scaledBox =
            new THREE.Box3()
                .setFromObject(model);


        const center =
            new THREE.Vector3();


        scaledBox.getCenter(
            center
        );


        model.position.x -=
            center.x;


        model.position.z -=
            center.z;


        ////////////////////////////////////////////////////
        // НИЗ МОДЕЛИ = Y 0
        ////////////////////////////////////////////////////

        const finalBox =
            new THREE.Box3()
                .setFromObject(model);


        model.position.y -=
            finalBox.min.y;


        ////////////////////////////////////////////////////
        // МАТЕРИАЛЫ И МЕШИ
        ////////////////////////////////////////////////////

        model.traverse(

            function(object) {

                if (
                    object.isMesh
                ) {

                    object.castShadow =
                        true;

                    object.receiveShadow =
                        true;

                }

            }

        );


        ////////////////////////////////////////////////////
        // ДОБАВЛЯЕМ В WORLD
        ////////////////////////////////////////////////////

        world.add(
            model
        );


        ////////////////////////////////////////////////////
        // ЗАГРУЗКА ЗАВЕРШЕНА
        ////////////////////////////////////////////////////

        loading.classList.add(
            "hidden"
        );


        status.innerText =
            "CREATURE.GLB загружена";

    },


    function(xhr) {

        if (xhr.total > 0) {

            const percent =
                Math.round(

                    xhr.loaded /
                    xhr.total *
                    100

                );


            status.innerText =
                "Загрузка: " +
                percent +
                "%";

        }

    },


    function(error) {

        console.error(
            "GLB ERROR:",
            error
        );


        loading.innerText =
            "Ошибка загрузки creature.glb";


        status.innerText =
            "Не удалось загрузить модель";

    }

);


////////////////////////////////////////////////////////////
// ПРОВЕРКА AR
////////////////////////////////////////////////////////////

async function checkAR() {

    if (
        !navigator.xr
    ) {

        startAR.disabled =
            true;

        startAR.innerText =
            "WebXR недоступен";

        return;

    }


    try {

        const supported =
            await navigator.xr.isSessionSupported(
                "immersive-ar"
            );


        if (!supported) {

            startAR.disabled =
                true;

            startAR.innerText =
                "AR не поддерживается";

        }

    }

    catch(error) {

        console.error(error);

        startAR.disabled =
            true;

    }

}


checkAR();


////////////////////////////////////////////////////////////
// ЗАПУСК AR
////////////////////////////////////////////////////////////

startAR.addEventListener(

    "click",

    async function() {

        if (!model) {

            status.innerText =
                "Подождите, модель ещё загружается.";

            return;

        }


        try {

            //////////////////////////////////////////////////
            // СОЗДАЁМ AR SESSION
            //////////////////////////////////////////////////

            const session =
                await navigator.xr.requestSession(

                    "immersive-ar",

                    {

                        requiredFeatures: [

                            "local-floor"

                        ],

                        optionalFeatures: [

                            "hit-test"

                        ]

                    }

                );


            //////////////////////////////////////////////////
            // REFERENCE SPACE
            //////////////////////////////////////////////////

            renderer.xr.setReferenceSpaceType(
                "local-floor"
            );


            //////////////////////////////////////////////////
            // ПОДКЛЮЧАЕМ SESSION
            //////////////////////////////////////////////////

            await renderer.xr.setSession(
                session
            );


            //////////////////////////////////////////////////
            // МОДЕЛЬ ПЕРЕД ПОЛЬЗОВАТЕЛЕМ
            //
            // В XR координатах:
            //
            // X = вправо
            // Y = вверх
            // Z = назад
            //
            //////////////////////////////////////////////////

            model.position.set(

                0,
                0,
                -2

            );


            //////////////////////////////////////////////////
            // МЕНЮ СКРЫВАЕМ
            //////////////////////////////////////////////////

            menu.style.display =
                "none";


            arPanel.style.display =
                "block";


            status.innerText =
                "AR активен. Ходите вокруг модели.";


            //////////////////////////////////////////////////
            // AR END
            //////////////////////////////////////////////////

            session.addEventListener(

                "end",

                function() {

                    arPanel.style.display =
                        "none";


                    menu.style.display =
                        "block";


                    status.innerText =
                        "AR завершён";

                }

            );

        }

        catch(error) {

            console.error(
                "AR ERROR:",
                error
            );


            status.innerText =
                "Ошибка запуска AR: " +
                error.message;

        }

    }

);


////////////////////////////////////////////////////////////
// ВЫХОД ИЗ AR
////////////////////////////////////////////////////////////

exitAR.addEventListener(

    "click",

    function() {

        const session =
            renderer.xr.getSession();


        if (session) {

            session.end();

        }

    }

);


////////////////////////////////////////////////////////////
// ПОЛУЧЕНИЕ ПОЗИЦИИ ТЕЛЕФОНА
////////////////////////////////////////////////////////////

function updateXRPosition() {

    if (
        !renderer.xr.isPresenting
    ) {

        return;

    }


    ////////////////////////////////////////////////////////
    // XR CAMERA
    ////////////////////////////////////////////////////////

    const xrCamera =
        renderer.xr.getCamera();


    ////////////////////////////////////////////////////////
    // ПОЗИЦИЯ
    ////////////////////////////////////////////////////////

    const x =
        xrCamera.position.x;


    const y =
        xrCamera.position.y;


    const z =
        xrCamera.position.z;


    ////////////////////////////////////////////////////////
    // ОРИЕНТАЦИЯ
    ////////////////////////////////////////////////////////

    const rx =
        xrCamera.rotation.x;


    const ry =
        xrCamera.rotation.y;


    const rz =
        xrCamera.rotation.z;


    ////////////////////////////////////////////////////////
    // ПОКАЗЫВАЕМ
    ////////////////////////////////////////////////////////

    positionElement.innerHTML =

        "X: " +
        x.toFixed(3) +

        "<br>" +

        "Y: " +
        y.toFixed(3) +

        "<br>" +

        "Z: " +
        z.toFixed(3) +

        "<br>" +

        "RX: " +
        rx.toFixed(3) +

        "<br>" +

        "RY: " +
        ry.toFixed(3) +

        "<br>" +

        "RZ: " +
        rz.toFixed(3);

}


////////////////////////////////////////////////////////////
// DESKTOP CAMERA
////////////////////////////////////////////////////////////

let desktopMode =
    false;


let mouseDown =
    false;


let lastMouseX =
    0;


let lastMouseY =
    0;


let angleX =
    0;


let angleY =
    0;


let cameraDistance =
    5;


////////////////////////////////////////////////////////////
// ОТКРЫТЬ ОБЫЧНУЮ 3D СЦЕНУ
////////////////////////////////////////////////////////////

start3D.addEventListener(

    "click",

    function() {

        if (!model) {

            status.innerText =
                "Модель ещё загружается.";

            return;

        }


        desktopMode =
            true;


        menu.style.display =
            "none";


        status.innerText =
            "3D сцена. Мышь — вращение.";

    }

);


////////////////////////////////////////////////////////////
// MOUSE DOWN
////////////////////////////////////////////////////////////

canvas.addEventListener(

    "mousedown",

    function(event) {

        if (
            !desktopMode ||
            renderer.xr.isPresenting
        ) {

            return;

        }


        mouseDown =
            true;


        lastMouseX =
            event.clientX;


        lastMouseY =
            event.clientY;

    }

);


////////////////////////////////////////////////////////////
// MOUSE UP
////////////////////////////////////////////////////////////

window.addEventListener(

    "mouseup",

    function() {

        mouseDown =
            false;

    }

);


////////////////////////////////////////////////////////////
// MOUSE MOVE
////////////////////////////////////////////////////////////

window.addEventListener(

    "mousemove",

    function(event) {

        if (
            !mouseDown ||
            renderer.xr.isPresenting
        ) {

            return;

        }


        const dx =
            event.clientX -
            lastMouseX;


        const dy =
            event.clientY -
            lastMouseY;


        angleY -=
            dx * 0.005;


        angleX -=
            dy * 0.005;


        angleX =
            Math.max(

                -1.4,

                Math.min(
                    1.4,
                    angleX
                )

            );


        lastMouseX =
            event.clientX;


        lastMouseY =
            event.clientY;


        updateDesktopCamera();

    }

);


////////////////////////////////////////////////////////////
// WHEEL
////////////////////////////////////////////////////////////

canvas.addEventListener(

    "wheel",

    function(event) {

        if (
            !desktopMode ||
            renderer.xr.isPresenting
        ) {

            return;

        }


        cameraDistance +=
            event.deltaY * 0.01;


        cameraDistance =
            Math.max(

                1,

                Math.min(
                    20,
                    cameraDistance
                )

            );


        updateDesktopCamera();

    }

);


////////////////////////////////////////////////////////////
// DESKTOP CAMERA
////////////////////////////////////////////////////////////

function updateDesktopCamera() {

    camera.position.x =
        Math.sin(angleY) *
        cameraDistance;


    camera.position.z =
        Math.cos(angleY) *
        cameraDistance;


    camera.position.y =
        1.5 +
        angleX * 2;


    camera.lookAt(

        0,
        1,
        0

    );

}


////////////////////////////////////////////////////////////
// RENDER LOOP
////////////////////////////////////////////////////////////

renderer.setAnimationLoop(

    function() {

        updateXRPosition();


        renderer.render(

            scene,
            camera

        );

    }

);


////////////////////////////////////////////////////////////
// RESIZE
////////////////////////////////////////////////////////////

window.addEventListener(

    "resize",

    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,
            window.innerHeight

        );

    }

);

</script>

</body>

</html>
