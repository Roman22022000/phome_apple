
<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Creature AR</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #050505;

    color: #ffffff;

    font-family: Arial, sans-serif;

}

#canvas {

    position: fixed;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    display: block;

}


/* =========================================
   МЕНЮ
========================================= */

#menu {

    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    z-index: 20;

    width: 300px;

    background: rgba(10,10,10,0.9);

    border: 1px solid #333;

    border-radius: 8px;

    padding: 20px;

    backdrop-filter: blur(15px);

}

#menu h1 {

    font-size: 20px;

    font-weight: 400;

    text-align: center;

    margin-bottom: 20px;

}

.menu-button {

    width: 100%;

    height: 48px;

    margin-top: 10px;

    border: 1px solid #333;

    background: #151515;

    color: white;

    border-radius: 5px;

    cursor: pointer;

    font-size: 14px;

}

.menu-button:hover {

    background: #222;

}


/* =========================================
   СТАТУС
========================================= */

#status {

    position: fixed;

    left: 50%;
    bottom: 25px;

    transform: translateX(-50%);

    z-index: 30;

    padding: 10px 16px;

    background: rgba(0,0,0,0.75);

    border: 1px solid #333;

    border-radius: 5px;

    color: #aaa;

    font-size: 12px;

    text-align: center;

}


/* =========================================
   AR ИНТЕРФЕЙС
========================================= */

#arPanel {

    position: fixed;

    left: 15px;
    top: 15px;

    z-index: 30;

    display: none;

    width: 250px;

    padding: 14px;

    background: rgba(0,0,0,0.75);

    border: 1px solid #333;

    border-radius: 7px;

    backdrop-filter: blur(10px);

}

#arTitle {

    font-size: 15px;

    margin-bottom: 10px;

}

#coordinates {

    font-family: monospace;

    font-size: 11px;

    color: #888;

    line-height: 1.6;

}

#exitAR {

    width: 100%;

    margin-top: 12px;

    padding: 9px;

    border: none;

    border-radius: 4px;

    background: white;

    color: black;

    cursor: pointer;

}


/* =========================================
   LOADING
========================================= */

#loading {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;

    justify-content: center;

    background: #050505;

    color: white;

    font-size: 14px;

}

#loading.active {

    display: flex;

}


/* =========================================
   DESKTOP
========================================= */

#desktopViewer {

    position: fixed;

    inset: 0;

    z-index: 10;

    display: none;

}

#desktopViewer.active {

    display: block;

}

#desktopInfo {

    position: fixed;

    top: 15px;
    left: 15px;

    z-index: 20;

    padding: 12px;

    background: rgba(0,0,0,0.75);

    border: 1px solid #333;

    border-radius: 6px;

    font-size: 12px;

    color: #aaa;

}

</style>

</head>


<body>


<!-- =========================================
     THREE.JS CANVAS
========================================= -->

<canvas id="canvas"></canvas>


<!-- =========================================
     ГЛАВНОЕ МЕНЮ
========================================= -->

<div id="menu">

    <h1>
        CREATURE 3D
    </h1>

    <button
        class="menu-button"
        id="startAR">

        Запустить AR

    </button>

    <button
        class="menu-button"
        id="startDesktop">

        Открыть 3D сцену

    </button>

</div>


<!-- =========================================
     AR PANEL
========================================= -->

<div id="arPanel">

    <div id="arTitle">
        CREATURE.GLB
    </div>

    <div id="coordinates">

        X: 0.000<br>
        Y: 0.000<br>
        Z: 0.000<br>
        RX: 0.000<br>
        RY: 0.000<br>
        RZ: 0.000

    </div>

    <button id="exitAR">
        Завершить AR
    </button>

</div>


<!-- =========================================
     DESKTOP
========================================= -->

<div id="desktopViewer">

    <div id="desktopInfo">

        Вращение: мышь<br>
        Приближение: колесо

    </div>

</div>


<!-- =========================================
     STATUS
========================================= -->

<div id="status">

    Загрузка модели...

</div>


<!-- =========================================
     LOADING
========================================= -->

<div id="loading">

    Загрузка creature.glb...

</div>


<!-- =========================================
     THREE.JS
========================================= -->

<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/examples/js/loaders/GLTFLoader.js"></script>


<script>

////////////////////////////////////////////////////////////
// ПУТЬ К МОДЕЛИ
////////////////////////////////////////////////////////////

const MODEL_URL =
    "https://raw.githubusercontent.com/Roman22022000/phome_apple/main/creature.glb";


////////////////////////////////////////////////////////////
// HTML
////////////////////////////////////////////////////////////

const canvas =
    document.getElementById("canvas");

const menu =
    document.getElementById("menu");

const status =
    document.getElementById("status");

const loading =
    document.getElementById("loading");

const arPanel =
    document.getElementById("arPanel");

const coordinates =
    document.getElementById("coordinates");

const startAR =
    document.getElementById("startAR");

const startDesktop =
    document.getElementById("startDesktop");

const exitAR =
    document.getElementById("exitAR");

const desktopViewer =
    document.getElementById("desktopViewer");


////////////////////////////////////////////////////////////
// RENDERER
////////////////////////////////////////////////////////////

const renderer =
    new THREE.WebGLRenderer({

        canvas: canvas,

        antialias: true,

        alpha: true,

        preserveDrawingBuffer: false

    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


////////////////////////////////////////////////////////////
// WEBXR
////////////////////////////////////////////////////////////

renderer.xr.enabled = true;


////////////////////////////////////////////////////////////
// SCENE
////////////////////////////////////////////////////////////

const scene =
    new THREE.Scene();


////////////////////////////////////////////////////////////
// CAMERA
////////////////////////////////////////////////////////////

const camera =
    new THREE.PerspectiveCamera(

        70,

        window.innerWidth /
        window.innerHeight,

        0.01,

        1000

    );


////////////////////////////////////////////////////////////
// СВЕТ
////////////////////////////////////////////////////////////

const ambientLight =
    new THREE.HemisphereLight(

        0xffffff,

        0x444444,

        3

    );


scene.add(
    ambientLight
);


const directionalLight =
    new THREE.DirectionalLight(

        0xffffff,

        4

    );


directionalLight.position.set(

    5,
    10,
    5

);


scene.add(
    directionalLight
);


////////////////////////////////////////////////////////////
// WORLD
////////////////////////////////////////////////////////////

const world =
    new THREE.Group();


scene.add(
    world
);


////////////////////////////////////////////////////////////
// МОДЕЛЬ
////////////////////////////////////////////////////////////

let model = null;


const loader =
    new THREE.GLTFLoader();


////////////////////////////////////////////////////////////
// ЗАГРУЗКА CREATURE.GLB
////////////////////////////////////////////////////////////

loader.load(

    MODEL_URL,


    function(gltf) {

        model =
            gltf.scene;


        ////////////////////////////////////////////////////
        // РАЗМЕР
        ////////////////////////////////////////////////////

        const originalBox =
            new THREE.Box3()
                .setFromObject(
                    model
                );


        const originalSize =
            new THREE.Vector3();


        originalBox.getSize(
            originalSize
        );


        const maxSize =
            Math.max(

                originalSize.x,
                originalSize.y,
                originalSize.z

            );


        ////////////////////////////////////////////////////
        // МАСШТАБ
        ////////////////////////////////////////////////////

        if (maxSize > 0) {

            model.scale.setScalar(
                2 / maxSize
            );

        }


        ////////////////////////////////////////////////////
        // ЦЕНТР
        ////////////////////////////////////////////////////

        const box =
            new THREE.Box3()
                .setFromObject(
                    model
                );


        const center =
            new THREE.Vector3();


        box.getCenter(
            center
        );


        model.position.sub(
            center
        );


        ////////////////////////////////////////////////////
        // НИЗ МОДЕЛИ
        ////////////////////////////////////////////////////

        const finalBox =
            new THREE.Box3()
                .setFromObject(
                    model
                );


        model.position.y -=
            finalBox.min.y;


        ////////////////////////////////////////////////////
        // МЕШИ
        ////////////////////////////////////////////////////

        model.traverse(

            function(object) {

                if (
                    object.isMesh
                ) {

                    object.castShadow =
                        true;

                    object.receiveShadow =
                        true;

                }

            }

        );


        ////////////////////////////////////////////////////
        // ДОБАВЛЯЕМ
        ////////////////////////////////////////////////////

        world.add(
            model
        );


        status.innerText =
            "CREATURE.GLB загружена";


    },


    function(xhr) {

        if (xhr.total) {

            const percent =
                Math.round(

                    xhr.loaded /
                    xhr.total *
                    100

                );


            status.innerText =
                "Загрузка модели: " +
                percent +
                "%";

        }

    },


    function(error) {

        console.error(
            error
        );


        status.innerText =
            "Ошибка загрузки creature.glb";

    }

);


////////////////////////////////////////////////////////////
// WEBXR ПРОВЕРКА
////////////////////////////////////////////////////////////

async function checkARSupport() {

    if (
        !navigator.xr
    ) {

        startAR.disabled =
            true;

        startAR.innerText =
            "AR не поддерживается";

        return;

    }


    try {

        const supported =
            await navigator.xr.isSessionSupported(
                "immersive-ar"
            );


        if (!supported) {

            startAR.disabled =
                true;

            startAR.innerText =
                "AR недоступен";

        }

    }

    catch(error) {

        console.error(
            error
        );

    }

}


checkARSupport();


////////////////////////////////////////////////////////////
// ЗАПУСК AR
////////////////////////////////////////////////////////////

startAR.addEventListener(

    "click",

    async function() {

        if (!navigator.xr) {

            return;

        }


        if (!model) {

            status.innerText =
                "Модель ещё загружается";

            return;

        }


        try {

            //////////////////////////////////////////////////
            // AR SESSION
            //////////////////////////////////////////////////

            const session =
                await navigator.xr.requestSession(

                    "immersive-ar",

                    {

                        requiredFeatures: [

                            "local-floor"

                        ],

                        optionalFeatures: [

                            "hit-test",
                            "dom-overlay"

                        ]

                    }

                );


            //////////////////////////////////////////////////
            // REFERENCE SPACE
            //////////////////////////////////////////////////

            renderer.xr.setReferenceSpaceType(
                "local-floor"
            );


            //////////////////////////////////////////////////
            // SESSION
            //////////////////////////////////////////////////

            await renderer.xr.setSession(
                session
            );


            //////////////////////////////////////////////////
            // ПЕРВОНАЧАЛЬНОЕ ПОЛОЖЕНИЕ
            //////////////////////////////////////////////////

            model.position.set(

                0,
                0,
                -2

            );


            //////////////////////////////////////////////////
            // UI
            //////////////////////////////////////////////////

            menu.style.display =
                "none";


            arPanel.style.display =
                "block";


            status.innerText =
                "AR запущен. Ходите вокруг модели.";


            //////////////////////////////////////////////////
            // ЗАВЕРШЕНИЕ AR
            //////////////////////////////////////////////////

            session.addEventListener(

                "end",

                function() {

                    renderer.xr.setSession(
                        null
                    );

                    arPanel.style.display =
                        "none";

                    menu.style.display =
                        "block";

                    status.innerText =
                        "AR завершён";

                }

            );

        }

        catch(error) {

            console.error(
                error
            );


            status.innerText =
                "Ошибка запуска AR: " +
                error.message;

        }

    }

);


////////////////////////////////////////////////////////////
// ВЫХОД ИЗ AR
////////////////////////////////////////////////////////////

exitAR.addEventListener(

    "click",

    function() {

        const session =
            renderer.xr.getSession();


        if (session) {

            session.end();

        }

    }

);


////////////////////////////////////////////////////////////
// ПОЗИЦИЯ ТЕЛЕФОНА
////////////////////////////////////////////////////////////

function updateXRData() {

    if (
        !renderer.xr.isPresenting
    ) {

        return;

    }


    const xrCamera =
        renderer.xr.getCamera();


    ////////////////////////////////////////////////////////
    // ПОЗИЦИЯ
    ////////////////////////////////////////////////////////

    const position =
        xrCamera.position;


    ////////////////////////////////////////////////////////
    // ОРИЕНТАЦИЯ
    ////////////////////////////////////////////////////////

    const rotation =
        xrCamera.rotation;


    ////////////////////////////////////////////////////////
    // ПОКАЗЫВАЕМ ДАННЫЕ
    ////////////////////////////////////////////////////////

    coordinates.innerHTML =

        "X: " +
        position.x.toFixed(3) +

        "<br>" +

        "Y: " +
        position.y.toFixed(3) +

        "<br>" +

        "Z: " +
        position.z.toFixed(3) +

        "<br>" +

        "RX: " +
        rotation.x.toFixed(3) +

        "<br>" +

        "RY: " +
        rotation.y.toFixed(3) +

        "<br>" +

        "RZ: " +
        rotation.z.toFixed(3);

}


////////////////////////////////////////////////////////////
// DESKTOP РЕЖИМ
////////////////////////////////////////////////////////////

let mouseDown =
    false;

let mouseX =
    0;

let mouseY =
    0;

let rotationY =
    0;

let rotationX =
    0;

let distance =
    5;


startDesktop.addEventListener(

    "click",

    function() {

        menu.style.display =
            "none";

        desktopViewer.classList.add(
            "active"
        );

        status.innerText =
            "3D сцена открыта";

        camera.position.set(

            0,
            1.5,
            distance

        );

        camera.lookAt(

            0,
            1,
            0

        );

    }

);


////////////////////////////////////////////////////////////
// MOUSE DOWN
////////////////////////////////////////////////////////////

canvas.addEventListener(

    "mousedown",

    function(event) {

        mouseDown =
            true;

        mouseX =
            event.clientX;

        mouseY =
            event.clientY;

    }

);


////////////////////////////////////////////////////////////
// MOUSE UP
////////////////////////////////////////////////////////////

window.addEventListener(

    "mouseup",

    function() {

        mouseDown =
            false;

    }

);


////////////////////////////////////////////////////////////
// MOUSE MOVE
////////////////////////////////////////////////////////////

window.addEventListener(

    "mousemove",

    function(event) {

        if (!mouseDown) {

            return;

        }


        const dx =
            event.clientX -
            mouseX;


        const dy =
            event.clientY -
            mouseY;


        rotationY -=
            dx * 0.005;


        rotationX -=
            dy * 0.005;


        rotationX =
            Math.max(

                -1.4,

                Math.min(
                    1.4,
                    rotationX
                )

            );


        mouseX =
            event.clientX;


        mouseY =
            event.clientY;


        updateDesktopCamera();

    }

);


////////////////////////////////////////////////////////////
// MOUSE WHEEL
////////////////////////////////////////////////////////////

canvas.addEventListener(

    "wheel",

    function(event) {

        distance +=
            event.deltaY * 0.01;


        distance =
            Math.max(

                1,

                Math.min(
                    20,
                    distance
                )

            );


        updateDesktopCamera();

    }

);


////////////////////////////////////////////////////////////
// DESKTOP CAMERA
////////////////////////////////////////////////////////////

function updateDesktopCamera() {

    camera.position.x =
        Math.sin(
            rotationY
        ) *
        distance;


    camera.position.z =
        Math.cos(
            rotationY
        ) *
        distance;


    camera.position.y =
        1.5 +
        rotationX * 2;


    camera.lookAt(

        0,
        1,
        0

    );

}


////////////////////////////////////////////////////////////
// RENDER LOOP
////////////////////////////////////////////////////////////

renderer.setAnimationLoop(

    function() {

        updateXRData();


        renderer.render(

            scene,
            camera

        );

    }

);


////////////////////////////////////////////////////////////
// RESIZE
////////////////////////////////////////////////////////////

window.addEventListener(

    "resize",

    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,
            window.innerHeight

        );

    }

);

</script>

</body>

</html>
