<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>3D AR Viewer</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #canvas {
            position: fixed;
            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            display: block;
        }

        #ui {
            position: fixed;

            left: 20px;
            top: 20px;

            z-index: 100;

            width: 300px;

            padding: 18px;

            background: rgba(0,0,0,0.75);

            border: 1px solid rgba(255,255,255,0.2);

            border-radius: 8px;

            color: white;

            backdrop-filter: blur(10px);
        }

        #ui h1 {
            font-size: 18px;
            font-weight: 400;

            margin-bottom: 12px;
        }

        #status {
            color: #aaa;

            font-size: 13px;

            line-height: 1.5;

            margin-bottom: 15px;
        }

        #startAR {
            width: 100%;

            padding: 12px;

            background: white;

            color: black;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            font-size: 14px;
        }

        #startAR:disabled {
            opacity: 0.5;

            cursor: default;
        }

        #coordinates {
            margin-top: 15px;

            font-family: monospace;

            font-size: 11px;

            color: #777;

            line-height: 1.6;
        }

        #loading {
            position: fixed;

            inset: 0;

            z-index: 200;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #000;

            color: white;

            font-size: 14px;
        }

        .hidden {
            display: none !important;
        }

        @media(max-width:600px) {

            #ui {
                left: 10px;
                right: 10px;

                top: 10px;

                width: auto;
            }

        }

    </style>
</head>

<body>

<div id="loading">
    Загрузка 3D модели...
</div>

<div id="ui">

    <h1>3D AR Viewer</h1>

    <div id="status">
        Загрузка модели...
    </div>

    <button id="startAR">
        Запустить AR
    </button>

    <div id="coordinates">

        X: 0.000<br>
        Y: 0.000<br>
        Z: 0.000<br>

        RX: 0.000<br>
        RY: 0.000<br>
        RZ: 0.000

    </div>

</div>

<canvas id="canvas"></canvas>


<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/examples/js/loaders/GLTFLoader.js"></script>


<script>

////////////////////////////////////////////////////////////
// НАСТРОЙКИ
////////////////////////////////////////////////////////////

const MODEL_PATH = "./3d_model/model.glb";

const MODEL_SIZE = 2.0;


////////////////////////////////////////////////////////////
// HTML
////////////////////////////////////////////////////////////

const canvas =
    document.getElementById("canvas");

const loading =
    document.getElementById("loading");

const status =
    document.getElementById("status");

const startAR =
    document.getElementById("startAR");

const coordinates =
    document.getElementById("coordinates");


////////////////////////////////////////////////////////////
// RENDERER
////////////////////////////////////////////////////////////

const renderer =
    new THREE.WebGLRenderer({

        canvas: canvas,

        antialias: true,

        alpha: true,

        preserveDrawingBuffer: false

    });


renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


renderer.xr.enabled = true;


////////////////////////////////////////////////////////////
// СЦЕНА
////////////////////////////////////////////////////////////

const scene =
    new THREE.Scene();


////////////////////////////////////////////////////////////
// КАМЕРА
////////////////////////////////////////////////////////////

const camera =
    new THREE.PerspectiveCamera(

        70,

        window.innerWidth /
        window.innerHeight,

        0.01,

        1000

    );


////////////////////////////////////////////////////////////
// СВЕТ
////////////////////////////////////////////////////////////

const hemisphereLight =
    new THREE.HemisphereLight(

        0xffffff,

        0x444444,

        3

    );

scene.add(
    hemisphereLight
);


const directionalLight =
    new THREE.DirectionalLight(

        0xffffff,

        4

    );


directionalLight.position.set(
    5,
    10,
    5
);


scene.add(
    directionalLight
);


////////////////////////////////////////////////////////////
// 3D СЦЕНА
////////////////////////////////////////////////////////////

const world =
    new THREE.Group();


scene.add(
    world
);


////////////////////////////////////////////////////////////
// МОДЕЛЬ
////////////////////////////////////////////////////////////

let model = null;


const loader =
    new THREE.GLTFLoader();


loader.load(

    MODEL_PATH,


    function(gltf) {

        model =
            gltf.scene;


        ////////////////////////////////////////////////////
        // ОБРАБОТКА МЕШЕЙ
        ////////////////////////////////////////////////////

        model.traverse(
            function(object) {

                if (object.isMesh) {

                    object.castShadow = true;

                    object.receiveShadow = true;

                }

            }
        );


        ////////////////////////////////////////////////////
        // ПОЛУЧАЕМ РАЗМЕР
        ////////////////////////////////////////////////////

        const box =
            new THREE.Box3()
                .setFromObject(model);


        const size =
            new THREE.Vector3();


        box.getSize(size);


        const maxSize =
            Math.max(

                size.x,
                size.y,
                size.z

            );


        ////////////////////////////////////////////////////
        // МАСШТАБ
        ////////////////////////////////////////////////////

        if (maxSize > 0) {

            model.scale.setScalar(

                MODEL_SIZE /
                maxSize

            );

        }


        ////////////////////////////////////////////////////
        // ЦЕНТР МОДЕЛИ
        ////////////////////////////////////////////////////

        const center =
            new THREE.Vector3();


        new THREE.Box3()
            .setFromObject(model)
            .getCenter(center);


        model.position.sub(center);


        ////////////////////////////////////////////////////
        // ПОСТАВИТЬ НИЗ МОДЕЛИ НА Y = 0
        ////////////////////////////////////////////////////

        const finalBox =
            new THREE.Box3()
                .setFromObject(model);


        model.position.y -=
            finalBox.min.y;


        ////////////////////////////////////////////////////
        // ДОБАВЛЯЕМ МОДЕЛЬ
        ////////////////////////////////////////////////////

        world.add(
            model
        );


        ////////////////////////////////////////////////////
        // ГОТОВО
        ////////////////////////////////////////////////////

        loading.classList.add(
            "hidden"
        );


        status.innerHTML =
            "Модель загружена.<br>" +
            "Готово к запуску AR.";

    },


    function(progress) {

        if (progress.total) {

            const percent =
                Math.round(

                    progress.loaded /
                    progress.total *
                    100

                );


            loading.innerText =
                "Загрузка 3D модели " +
                percent +
                "%";

        }

    },


    function(error) {

        console.error(error);


        loading.innerText =
            "Ошибка загрузки модели";


        status.innerHTML =
            "Файл не найден:<br>" +
            MODEL_PATH;

    }

);


////////////////////////////////////////////////////////////
// ПРОВЕРКА WEBXR
////////////////////////////////////////////////////////////

async function checkAR() {

    if (!navigator.xr) {

        status.innerHTML =
            "Этот браузер не поддерживает WebXR.";

        startAR.disabled = true;

        return;

    }


    const supported =
        await navigator.xr.isSessionSupported(
            "immersive-ar"
        );


    if (!supported) {

        status.innerHTML =
            "AR не поддерживается этим устройством.";

        startAR.disabled = true;

        return;

    }


    status.innerHTML =
        "AR поддерживается.<br>" +
        "Можно запускать сцену.";

}


checkAR();


////////////////////////////////////////////////////////////
// AR SESSION
////////////////////////////////////////////////////////////

let xrSession = null;


startAR.addEventListener(

    "click",

    async function() {

        if (!navigator.xr) {

            return;

        }


        try {

            //////////////////////////////////////////////////
            // AR SESSION
            //////////////////////////////////////////////////

            xrSession =
                await navigator.xr.requestSession(

                    "immersive-ar",

                    {

                        requiredFeatures: [

                            "local-floor"

                        ],

                        optionalFeatures: [

                            "dom-overlay",
                            "hit-test"

                        ]

                    }

                );


            //////////////////////////////////////////////////
            // THREE.JS XR
            //////////////////////////////////////////////////

            renderer.xr.setReferenceSpaceType(
                "local-floor"
            );


            await renderer.xr.setSession(
                xrSession
            );


            //////////////////////////////////////////////////
            // UI
            //////////////////////////////////////////////////

            startAR.style.display =
                "none";


            status.innerHTML =
                "AR запущен.<br>" +
                "Перемещайтесь вокруг модели.";

        }

        catch(error) {

            console.error(error);


            status.innerHTML =
                "Не удалось запустить AR:<br>" +
                error.message;

        }

    }

);


////////////////////////////////////////////////////////////
// ПОЛОЖЕНИЕ ПОЛЬЗОВАТЕЛЯ
////////////////////////////////////////////////////////////

function updateUserPosition() {

    if (!renderer.xr.isPresenting) {

        return;

    }


    const xrCamera =
        renderer.xr.getCamera();


    const position =
        xrCamera.position;


    const rotation =
        xrCamera.rotation;


    coordinates.innerHTML =

        "X: " +
        position.x.toFixed(3) +
        "<br>" +

        "Y: " +
        position.y.toFixed(3) +
        "<br>" +

        "Z: " +
        position.z.toFixed(3) +
        "<br>" +

        "RX: " +
        rotation.x.toFixed(3) +
        "<br>" +

        "RY: " +
        rotation.y.toFixed(3) +
        "<br>" +

        "RZ: " +
        rotation.z.toFixed(3);

}


////////////////////////////////////////////////////////////
// AR ANIMATION LOOP
////////////////////////////////////////////////////////////

renderer.setAnimationLoop(

    function() {

        updateUserPosition();


        renderer.render(

            scene,

            camera

        );

    }

);


////////////////////////////////////////////////////////////
// RESIZE
////////////////////////////////////////////////////////////

window.addEventListener(

    "resize",

    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,
            window.innerHeight

        );

    }

);

</script>

</body>
</html>
